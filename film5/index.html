<script>
(() => {
  const V = OM.vars();
  const W = 1920, H = 1080, TAU = Math.PI * 2, CX = W / 2, CY = H / 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const clamp01 = v => clamp(v, 0, 1);
  const smooth = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
  const mix = (a, b, t) => a + (b - a) * t;
  const rnd = OM.random(20261020);
  const hex = h => { const s = h.replace('#',''); return [parseInt(s.slice(0,2),16)/255, parseInt(s.slice(2,4),16)/255, parseInt(s.slice(4,6),16)/255]; };
  const css = (c, a) => `rgba(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)},${a})`;

  /* ==========================================================
     粒子
     ========================================================== */
  const N = 1500;
  const role = new Uint8Array(N);
  const pu = new Float32Array(N), pv = new Float32Array(N), pw = new Float32Array(N), pz = new Float32Array(N);
  const psize = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    pu[i] = rnd(); pv[i] = rnd(); pw[i] = rnd(); pz[i] = rnd();
    const r = rnd();
    role[i] = r < 0.13 ? 1 : r < 0.27 ? 2 : r < 0.36 ? 3 : r < 0.47 ? 4 : r < 0.51 ? 5 : 0;
    psize[i] = 1.1 + rnd() * 2.4 + (role[i] === 5 ? 2.6 : 0) + (role[i] === 0 ? 0.5 : 0);
  }
  const ROLE_COL = [null, hex(V.cHuman), hex(V.cAI), hex(V.cAI2), hex(V.cWarm), [1,1,1]];
  const ACCENT = { start: hex(V.cHuman), one: hex(V.cAI), two: hex(V.cAI2), three: hex(V.cWarm), all: hex(V.cHuman), join: hex(V.cAI) };

  const DRIFT_GAIN = 4.2;
  const drift = (i, t, amp, sp) => {
    const a = pu[i] * TAU, b = pv[i] * TAU;
    return [
      (Math.cos(a + t * sp) * amp + Math.cos(b + t * sp * 1.63) * amp * .7) * DRIFT_GAIN,
      (Math.sin(b * 1.3 + t * sp * .82) * amp + Math.sin(a * 1.87 + t * sp * 1.31) * amp * .7) * DRIFT_GAIN
    ];
  };
  const sideOf = i => (role[i] === 2 || role[i] === 3) ? -1 : (role[i] === 1 ? 1 : (pu[i] < .52 ? -1 : 1));

  /* ---------------- 通用构图原语 ---------------- */
  const ring = (i, t, cx, cy, R, ry, spin) => {
    const a = pu[i] * TAU + (spin || 0) * t;
    return [cx + Math.cos(a) * R, cy + Math.sin(a) * (ry == null ? R : ry)];
  };
  const blob = (i, t, cx, cy, R, wob) => {
    const a = pv[i] * TAU, r = (0.1 + 0.9 * pw[i]) * R;
    return [cx + Math.cos(a) * r + Math.cos(pu[i] * TAU + t * .7) * (wob || 0),
            cy + Math.sin(a) * r + Math.sin(pv[i] * TAU + t * .6) * (wob || 0)];
  };
  const grid = (i, t, cx, cy, cols, rows, w, h) => {
    const c = Math.floor(pu[i] * cols), r = Math.floor(pw[i] * rows);
    return [cx + ((c + .5) / cols - .5) * w, cy + ((r + .5) / rows - .5) * h];
  };
  const flow = (i, t, x0, x1, y, spread) => {
    const p = (t * .5 + pv[i]) % 1;
    return [mix(x0, x1, p), y + (pw[i] - .5) * spread];
  };

  /* ==========================================================
     19 个分镜的形态：每个分镜一种"看得懂的画面"
     ========================================================== */
  const SH = {};
  /* 形态一律返回**以画面中心为原点**的坐标（0,0 = 中心）：
     渲染层再乘镜头、加半屏偏移，旧版把 CX/CY 写进形态里，等于偏移了两次。 */

  // 00 起点：一点炸成回声涟漪
  SH.ignite = (i, t) => {
    if (t < 0.25) return [(pu[i] - .5) * 3, (pv[i] - .5) * 3];
    if (t < 2.1) {
      const k = (t - .25) / 1.85, ang = pu[i] * TAU, R = k * 620, th = (pv[i] - .5) * 46;
      const d = drift(i, t, 1.2, .8);
      return [Math.cos(ang) * (R + th) + d[0], Math.sin(ang) * (R + th) * .76 + d[1]];
    }
    const z = pz[i] * 2 - 1, rr = Math.sqrt(Math.max(0, 1 - z * z)), ang = pu[i] * TAU;
    const R = (0.18 + 0.82 * pv[i]) * 470, d = drift(i, t, 9, .55);
    return [Math.cos(ang) * rr * R * 1.3 + d[0], Math.sin(ang) * rr * R * .78 + d[1]];
  };

  // 01 追问：光射出去，又折回来
  SH.ask = (i, t) => {
    if (role[i] === 0 && pv[i] < 0.42) {
      const p = (t * .55 + pv[i] / .42) % 1;
      const dir = p < .5 ? 1 : -1;
      const q = Math.abs(p - .5) * 2;
      return [dir * q * 460, -150 + Math.sin(q * Math.PI) * 70];
    }
    return blob(i, t, 0, 130, 180, 12);
  };

  // 02 补全：两列代码条带（行距要大于连线半径 132px，否则行间会连成一片）
  SH.cowrite = (i, t) => {
    const rows = 5, row = Math.floor(pw[i] * rows);
    const col = (pu[i] + (role[i] === 0 ? 0 : .5)) % 1 < .5 ? -1 : 1;
    const head = Math.floor(t * .9) % rows;
    if (role[i] === 0) {                       // 光标：正在写的那一行的末端
      const u = (pv[i] * 3.1) % 1;
      return [col * (540 + u * 30), -300 + head * 150 + (u - .5) * 70];
    }
    const u = (pu[i] * 6.7) % 1;
    const len = 210 + 250 * (.4 + .6 * Math.abs(Math.sin(row * 2.399 + (col > 0 ? 1.1 : 0))));
    return [col * (110 + u * len), -300 + row * 150];
  };

  // 03 反驳：两团对撞，中间留一道排斥的缝
  SH.rebut = (i, t) => {
    const s = sideOf(i);
    const push = 1 + Math.sin(t * 1.3) * .09;
    return blob(i, t, s * 320 * push, 0, 205, 16);
  };

  // 04 记得：一圈记忆节点按序点亮
  SH.remember = (i, t) => {
    const idx = Math.floor(pu[i] * 18);
    const head = Math.floor(t * 2.5) % 18;
    const on = ((head - idx + 18) % 18) < 3;
    const a = pu[i] * TAU;
    return [Math.cos(a) * 320 * 1.2, Math.sin(a) * 320 * .8 + (on ? 0 : -14)];
  };

  // 05 边界：一条清晰的界线，线外的粒子被挡在外面
  SH.boundary = (i, t) => {
    if (role[i] === 0 && pv[i] < .38) {
      return [-190 + pw[i] * 380, (pu[i] - .5) * 8];
    }
    const s = pu[i] < .5 ? -1 : 1;
    const d = 80 + pv[i] * 170;
    return [s * (250 + d), (pw[i] - .5) * 420];
  };

  // 06 接力：三个节点串成链，光沿线传递
  SH.relay = (i, t) => {
    const xs = [-290, 0, 290];
    const prog = (t * .45) % 1;
    if (role[i] === 0 && pv[i] < .4) {
      const seg = Math.min(1, Math.floor(prog * 2));
      const u = prog * 2 - seg;
      return [mix(xs[seg], xs[seg + 1], u), Math.sin(u * Math.PI) * -46];
    }
    const idx = Math.min(2, Math.floor(pu[i] * 3));
    const a = pv[i] * TAU, r = (0.1 + 0.9 * pw[i]) * 76;
    const lit = 1 - Math.min(1, Math.abs(prog * 2 - idx));
    return [xs[idx] + Math.cos(a) * r, Math.sin(a) * r * .92 - lit * 10];
  };

  // 07 互相纠正：两团之间来回的信号弧
  SH.debate = (i, t) => {
    if (role[i] === 0 && pv[i] < .3) {
      const p = (t * .7 + pv[i] / .3) % 1;
      const dir = p < .5 ? 1 : -1;
      const q = Math.abs(p - .5) * 2;
      return [mix(-290, 290, q), dir * Math.sin(q * Math.PI) * 205];
    }
    return blob(i, t, sideOf(i) * 300, 0, 185, 14);
  };

  // 08 共享记忆：中心一个球，两边各一团直连
  SH.sharedmem = (i, t) => {
    if (role[i] === 0 && pv[i] < .34) {
      const s = pu[i] < .5 ? -1 : 1;
      const k = pw[i];
      return [s * mix(0, 360, k), Math.sin(k * 3.1) * 20];
    }
    if (role[i] === 0 && pv[i] < .5) {
      const a = pu[i] * TAU, z = pz[i] * 2 - 1, rr = Math.sqrt(Math.max(0, 1 - z * z));
      return [Math.cos(a) * rr * 150, Math.sin(a) * rr * 150];
    }
    const s = pu[i] < .5 ? -1 : 1;
    return blob(i, t, s * 380, 0, 180, 16);
  };

  // 09 看不见的那一段：一长串信号横穿画面
  SH.blackbox = (i, t) => {
    const p = (t * .32 + pu[i]) % 1;
    const y = (pv[i] - .5) * 260;
    const fade = Math.sin(p * Math.PI);
    return [mix(-880, 880, p), y * (0.4 + fade * 0.6) - 40];
  };

  // 10 新的能力：一簇粒子从无到有地长出来
  SH.newcap = (i, t) => {
    const k = clamp01(t / 6);
    const a = pv[i] * TAU, r = (0.05 + 0.95 * pw[i]) * 300 * k;
    const rise = (1 - k) * 260;
    return [Math.cos(a) * r, -60 + Math.sin(a) * r * .9 - rise];
  };

  // 11 先开口：两个远点，一个先亮，线连过去
  SH.firstword = (i, t) => {
    const left = pu[i] < .5;
    const k = clamp01((t - 1.2) / 3.4);
    if (role[i] === 0 && pv[i] < .22) {
      return [mix(-430, 430, k), (pw[i] - .5) * 10];
    }
    return blob(i, t, left ? -430 : 430, 0, 150, 12);
  };

  // 12 一句话引来一串：一条线分裂成多条
  SH.thread = (i, t) => {
    if (role[i] === 0 && pv[i] < .46) {
      const k = pw[i], branch = Math.floor(pu[i] * 7);
      const reach = clamp01((t - 1) / 5);
      const spread = (branch - 3) * 78;
      return [120 + k * 700 * reach, spread * k * reach];
    }
    return blob(i, t, -300, 0, 150, 12);
  };

  // 13 一起解决：五个人围成圆，一起向内用力
  SH.together = (i, t) => {
    const n = 4, idx = Math.min(n - 1, Math.floor(pu[i] * n));
    const a = idx / n * TAU + t * .12;
    const squeeze = 1 - Math.abs(Math.sin(t * .55)) * .22;
    const cx = Math.cos(a) * 360 * squeeze, cy = Math.sin(a) * 360 * squeeze * .8;
    const ang = pv[i] * TAU, r = (0.08 + 0.92 * pw[i]) * 68;
    return [cx + Math.cos(ang) * r, cy + Math.sin(ang) * r];
  };

  // 14 连接不是流量：两点短暂连上又断开
  SH.stranger = (i, t) => {
    const on = Math.sin(t * 1.1) > -.2;
    if (role[i] === 0 && pv[i] < .3 && on) {
      const k = pw[i];
      return [mix(-480, 480, k), (pu[i] - .5) * 8];
    }
    return blob(i, t, pu[i] < .5 ? -480 : 480, 0, 155, 12);
  };

  // 15 温度：暖色粒子在两点之间流动
  SH.warmth = (i, t) => {
    if (role[i] === 0 && pv[i] < .4) {
      const p = (t * .34 + pw[i]) % 1;
      return [mix(-500, 500, p), Math.sin(p * Math.PI) * (pv[i] / .4) * 180 - 60];
    }
    return blob(i, t, -500, 0, 165, 12);
  };

  // 16 涌现：三色合流成球，球上冒出小簇
  SH.emerge = (i, t) => {
    const z = pz[i] * 2 - 1, rr = Math.sqrt(Math.max(0, 1 - z * z));
    const ang = pu[i] * TAU + t * .12;
    if (role[i] === 0 && pv[i] < .2) {
      const a2 = pu[i] * TAU + t * .6;
      const R2 = 520 + (pv[i] / .2 - .5) * 90;
      return [Math.cos(a2) * R2 * 1.15, Math.sin(a2) * R2 * .85];
    }
    const R = 400 + (pv[i] - .5) * 40;
    return [Math.cos(ang) * rr * R * 1.12, Math.sin(ang) * rr * R - 60];
  };

  // 17 不是被造出来的：粒子自己聚成一个新形态
  SH.notmade = (i, t) => {
    const k = clamp01(t / 8);
    const a = pu[i] * TAU, r = (0.15 + 0.85 * pw[i]) * 300 * k;
    const spiral = a + r * .012;
    return [Math.cos(spiral) * r * 1.35, Math.sin(spiral) * r * .9 - 40];
  };

  // 18 加入：拱门 + 品牌
  SH.gate = (i, t) => {
    const d = drift(i, t, 4, .6);
    const base = 570;                       // 拱门压到画面下半，给居中文字和尾卡让位
    if (pv[i] < .3) {
      const side = pu[i] < .5 ? -1 : 1;
      const h = (pv[i] / .3) * 300;
      return [side * 330 + d[0], base - h + d[1]];
    }
    const u = pu[i] * 2 - 1;
    const ang = Math.acos(clamp(u, -1, 1));
    return [Math.cos(ang) * 330 * 1.1 + d[0], base - Math.sin(ang) * 300 + d[1]];
  };

  /* ==========================================================
  /* ==========================================================
     19 个分镜
     ========================================================== */
  const SHOTS = [
    { id:'origin', dur:20, shape:'ignite', acc:'start', chapter:0, cam:[{z:1.62,x:0,y:-20},{z:1.0,x:0,y:0}],
      lines:[
        { at:1.5, head:'一切从一个节点开始', sub:'最初的节点是人' },
        { at:10, head:'而它会长出三种关系', sub:'人与 AI、AI 与 AI、人与人' }
      ]},

    { id:'ask', dur:14, shape:'ask', acc:'one', chapter:1, cam:[{z:1.1,x:0,y:0},{z:1.0,x:0,y:0}],
      lines:[{ at:1.2, kicker:'一 · 人与 AI', head:'它会追问', sub:'你说"帮我写个方案"，它先问：写给谁看？' }]},
    { id:'cowrite', dur:14, shape:'cowrite', acc:'one', chapter:1, cam:[{z:1.0,x:0,y:0},{z:1.08,x:0,y:0}],
      lines:[{ at:1.2, head:'它会补全', sub:'你写了一半，它接着写完——而且比你的开头更笃定' }]},
    { id:'rebut', dur:14, shape:'rebut', acc:'one', chapter:1, cam:[{z:1.0,x:0,y:0},{z:1.06,x:0,y:0}],
      lines:[{ at:1.2, head:'它会反驳', sub:'第七版你说"这就行了"，它说：不是这个原因' }]},
    { id:'remember', dur:14, shape:'remember', acc:'one', chapter:1, cam:[{z:1.02,x:0,y:0},{z:.96,x:0,y:0}],
      lines:[{ at:1.2, head:'它会记得', sub:'上次你说"别给我选项"，这次它没给' }]},
    { id:'boundary', dur:14, shape:'boundary', acc:'one', chapter:1, cam:[{z:1.0,x:0,y:0},{z:1.04,x:0,y:0}],
      lines:[{ at:1.2, head:'它有边界', sub:'该由你决定的那一句，它留给了你' }]},

    { id:'relay', dur:14, shape:'relay', acc:'two', chapter:2, cam:[{z:1.05,x:0,y:0},{z:.98,x:0,y:0}],
      lines:[{ at:1.2, kicker:'二 · AI 与 AI', head:'一个查天气，一个查日程', sub:'第三个把它们合成一句话给你' }]},
    { id:'debate', dur:14, shape:'debate', acc:'two', chapter:2, cam:[{z:1.0,x:0,y:0},{z:1.08,x:0,y:0}],
      lines:[{ at:1.2, head:'两个模型对着干', sub:'一个说可行，另一个找出它错在哪' }]},
    { id:'sharedmem', dur:14, shape:'sharedmem', acc:'two', chapter:2, cam:[{z:1.06,x:0,y:0},{z:.98,x:0,y:0}],
      lines:[{ at:1.2, head:'一个存下，另一个取用', sub:'中间不需要你来翻译' }]},
    { id:'blackbox', dur:14, shape:'blackbox', acc:'two', chapter:2, cam:[{z:1.0,x:0,y:0},{z:1.1,x:0,y:0}],
      lines:[{ at:1.2, head:'你只说了一句话', sub:'后面发生了一整串你看不见的事' }]},
    { id:'newcap', dur:14, shape:'newcap', acc:'two', chapter:2, cam:[{z:1.0,x:0,y:0},{z:.94,x:0,y:0}],
      lines:[{ at:1.2, head:'今天它们能做的事', sub:'去年还不存在' }]},

    { id:'firstword', dur:14, shape:'firstword', acc:'three', chapter:3, cam:[{z:1.04,x:0,y:0},{z:1.0,x:0,y:0}],
      lines:[{ at:1.2, kicker:'三 · 人与人', head:'陌生人只说了一句', sub:'"你的图很好看"——然后你们聊了两小时' }]},
    { id:'thread', dur:14, shape:'thread', acc:'three', chapter:3, cam:[{z:1.0,x:0,y:0},{z:1.08,x:0,y:0}],
      lines:[{ at:1.2, head:'群里有人问了一句', sub:'沉默了很久，然后七个人都回了' }]},
    { id:'together', dur:14, shape:'together', acc:'three', chapter:3, cam:[{z:1.06,x:0,y:0},{z:.96,x:0,y:0}],
      lines:[{ at:1.2, head:'凌晨三点，四个人', sub:'为同一个问题，谁都不肯先睡' }]},
    { id:'stranger', dur:14, shape:'stranger', acc:'three', chapter:3, cam:[{z:1.0,x:0,y:0},{z:1.05,x:0,y:0}],
      lines:[{ at:1.2, head:'你帮过一个陌生人', sub:'他不会告诉你他是谁，也不会再出现' }]},
    { id:'warmth', dur:14, shape:'warmth', acc:'three', chapter:3, cam:[{z:1.0,x:0,y:0},{z:1.06,x:0,y:0}],
      lines:[{ at:1.2, head:'连接建立得慢', sub:'但一旦连上，就很难被切断' }]},

    { id:'emerge', dur:20, shape:'emerge', acc:'all', chapter:4, cam:[{z:1.0,x:0,y:0},{z:.9,x:0,y:0}],
      lines:[{ at:1.5, kicker:'万物', head:'犹如三生万物', sub:'三种连接同时发生，新的东西会自己长出来' }]},
    { id:'notmade', dur:20, shape:'notmade', acc:'all', chapter:4, cam:[{z:.94,x:0,y:0},{z:1.0,x:0,y:0}],
      lines:[{ at:1.5, head:'它不是被造出来的', sub:'它只需要被连接' }]},

    { id:'join', dur:30, shape:'gate', acc:'join', chapter:5, cam:[{z:1.0,x:0,y:0},{z:1.12,x:0,y:-20}],
      lines:[{ at:2, out:16, kicker:'加入我们', head:'让你的回声，被更多节点听见',
               sub:'这里有正在造 AI 的人，有正在和人机协作的团队，也有一群自己就会互相连接的智能体。' }]}
  ];

  // 时间轴：每个分镜的起止
  let acc = 0;
  SHOTS.forEach((s, i) => { s.t = acc; s.end = acc + s.dur; acc = s.dur + acc; s.index = i; });
  const TOTAL = acc;
  function shotAt(t) {
    for (let k = SHOTS.length - 1; k >= 0; k--) if (t >= SHOTS[k].t) return SHOTS[k];
    return SHOTS[0];
  }

  /* ---------------- 位置：分镜内的时间 ---------------- */
  const STAGE_X = 330;          // 形态整体右移，把左半屏留给文案
  function posOf(i, t) {
    const sc = shotAt(t);
    const local = t - sc.t;
    const p = SH[sc.shape](i, local);
    const off = sc.id === 'join' ? 0 : STAGE_X;
    // 整场呼吸 + 双向行波 + 每颗粒子自己的轨道
    const k = 1 + Math.sin(t * .23) * .07;
    const wy = Math.sin(t * 1.9 + p[1] * .006) * 30;
    const wx = Math.cos(t * 1.5 + p[0] * .005) * 24;
    const ph = pz[i] * TAU;
    const orb = 14 + pz[i] * 34;
    const ox = Math.cos(ph + t * (1.0 + pu[i] * 1.8)) * orb;
    const oy = Math.sin(ph * 1.3 + t * (.9 + pv[i] * 1.6)) * orb;
    const d = drift(i, t, 11, .8);            // 粒子级游移：形态不动的时候场也在动
    // 高频微抖：幅度只有几像素（形态不糊），但每帧都在变 —— 长片防"死时间"的关键
    const jx = Math.sin(t * 18.7 + ph * 3.1) * 5.5;
    const jy = Math.cos(t * 16.3 + ph * 2.3) * 5.5;
    return [p[0] * k + wx + ox + d[0] + jx + off, p[1] * k + wy + oy + d[1] + jy];
  }

  function camAt(t) {
    const sc = shotAt(t);
    const a = sc.cam[0], b = sc.cam[1];
    const f = smooth((t - sc.t) / Math.max(.001, sc.dur));
    return [mix(a.z, b.z, f), mix(a.x, b.x, f), mix(a.y, b.y, f)];
  }

  /* ==========================================================
     渲染
     ========================================================== */
  const cvs = document.getElementById('field');
  const ctx = cvs.getContext('2d', { alpha: true });
  const xs = new Float32Array(N), ys = new Float32Array(N), al = new Float32Array(N);
  const spriteFor = col => {
    const s = document.createElement('canvas'); s.width = s.height = 48;
    const c = s.getContext('2d');
    const g = c.createRadialGradient(24, 24, 0, 24, 24, 24);
    g.addColorStop(0, css(col, 1)); g.addColorStop(.22, css(col, .55));
    g.addColorStop(.55, css(col, .13)); g.addColorStop(1, css(col, 0));
    c.fillStyle = g; c.fillRect(0, 0, 48, 48);
    return s;
  };
  const SPRITES = ROLE_COL.map(c => spriteFor(c || [1,1,1]));
  const SPRITE_ACC = spriteFor([1,1,1]);

  const CELL = 118, COLS = Math.ceil(W / CELL) + 2, ROWS = Math.ceil(H / CELL) + 2;
  const head = new Int32Array(COLS * ROWS), nxt = new Int32Array(N);
  const BUCK = 6, MAXSEG = 2600;
  const segs = Array.from({ length: BUCK }, () => new Float32Array(MAXSEG * 4));
  const segN = new Int32Array(BUCK);

  function draw(t) {
    const [zoom, camX, camY] = camAt(t);
    const sc = shotAt(t);
    const acc = ACCENT[sc.acc];
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    for (let i = 0; i < N; i++) {
      const p = posOf(i, t);
      xs[i] = (p[0] - camX) * zoom + W / 2;
      ys[i] = (p[1] - camY) * zoom + H / 2;
      al[i] = (xs[i] < -80 || xs[i] > W + 80 || ys[i] < -80 || ys[i] > H + 80) ? 0 : (role[i] === 5 ? 1 : role[i] === 0 ? .55 : .78);
    }

    head.fill(-1);
    for (let i = 0; i < N; i++) {
      const cx = clamp((xs[i] / CELL) | 0, 0, COLS - 1), cy = clamp((ys[i] / CELL) | 0, 0, ROWS - 1);
      const k = cy * COLS + cx; nxt[i] = head[k]; head[k] = i;
    }
    segN.fill(0);
    const linkDist = 132, d2 = linkDist * linkDist;
    for (let i = 0; i < N; i++) {
      if (!al[i]) continue;
      const cx = clamp((xs[i] / CELL) | 0, 0, COLS - 1), cy = clamp((ys[i] / CELL) | 0, 0, ROWS - 1);
      for (let oy = 0; oy <= 1; oy++) {
        for (let ox = -1; ox <= 1; ox++) {
          if (oy === 0 && ox < 0) continue;
          if (oy === 1 && ox === 1) continue;
          const nx = cx + ox, ny = cy + oy;
          if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
          let j = head[ny * COLS + nx];
          while (j !== -1) {
            if (j > i) {
              const dx = xs[i] - xs[j], dy = ys[i] - ys[j];
              if (dx * dx + dy * dy < d2) {
                const b = (role[i] === 0 && role[j] === 0) ? 0 : Math.min(role[i] === 0 ? 5 : role[i], role[j] === 0 ? 5 : role[j]);
                const bi = Math.min(5, b);
                const arr = segs[bi], n = segN[bi];
                if (n < MAXSEG) {
                  const o = n * 4;
                  arr[o] = xs[i]; arr[o+1] = ys[i]; arr[o+2] = xs[j]; arr[o+3] = ys[j];
                  segN[bi] = n + 1;
                }
              }
            }
            j = nxt[j];
          }
        }
      }
    }
    for (let b = 0; b < BUCK; b++) {
      const n = segN[b]; if (!n) continue;
      const col = b === 0 ? acc : ROLE_COL[b];
      ctx.strokeStyle = css(col, .30); ctx.lineWidth = 1.15;
      ctx.beginPath();
      const arr = segs[b];
      for (let s = 0; s < n; s++) { const o = s * 4; ctx.moveTo(arr[o], arr[o+1]); ctx.lineTo(arr[o+2], arr[o+3]); }
      ctx.stroke();
    }
    for (let i = 0; i < N; i++) {
      if (!al[i]) continue;
      const col = role[i] === 0 ? acc : ROLE_COL[role[i]];
      const sp = role[i] === 0 ? SPRITE_ACC : SPRITES[role[i]];
      const r = psize[i] * (role[i] === 0 ? 1 : 1.15) * (zoom < 1 ? zoom : 1);
      ctx.globalAlpha = al[i];
      ctx.drawImage(sp, xs[i] - r * 1.6, ys[i] - r * 1.6, r * 3.2, r * 3.2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ==========================================================
     文字：每个文案一个块
     ========================================================== */
  const esc = c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' })[c] || c;
  const linesHost = document.getElementById('lines');
  const blocks = [];

  SHOTS.forEach(sc => sc.lines.forEach((ln, i) => {
    const center = sc.id === 'join';
    const el = document.createElement('div');
    el.className = 'ln-anchor' + (center ? ' ln-anchor--center' : '');
    el.setAttribute('data-layout-allow-occlusion', '');
    el.setAttribute('data-om-id', 'ln-' + sc.id);
    const kick = ln.kicker ? `<div class="ln__kick"><i></i><span>${esc(ln.kicker)}</span></div>` : '';
    const head = [...ln.head].map(c => (c === ' ' || c === '\n') ? c
      : `<span class="mask"><span class="ch">${esc(c)}</span></span>`).join('');
    const sub = ln.sub ? `<p class="ln__sub">${esc(ln.sub)}</p>` : '';
    el.innerHTML = `<div class="ln">${kick}<h2 class="ln__head">${head}</h2>${sub}</div>`;
    linesHost.appendChild(el);
    blocks.push({
      shot: sc, line: ln, el,
      inner: el.querySelector('.ln'),
      chars: el.querySelectorAll('.ch'),
      kick: el.querySelector('.ln__kick'),
      sub: el.querySelector('.ln__sub')
    });
  }));

  /* ==========================================================
     时间轴
     ========================================================== */
  const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
  const huds = [...document.querySelectorAll('.hud__ch')];
  const shotEl = document.getElementById('hudShot');
  const flashEl = document.getElementById('flash');

  gsap.set(blocks.map(b => b.inner), { opacity: 0 });
  gsap.set(blocks.map(b => b.chars), { yPercent: 140 });
  gsap.set(huds, { opacity: 0 });
  gsap.set(flashEl, { opacity: 0 });

  // 章节标签：乐谱的 !mark:hook! / !mark:one! … 落在这些标签上
  const CHAPTER_MARK = { 0: 'hook', 1: 'one', 2: 'two', 3: 'three', 4: 'all', 5: 'join' };
  SHOTS.forEach(sc => {
    tl.addLabel('scene:' + sc.id, sc.t);
    if (sc.index === 0 || sc.chapter !== SHOTS[sc.index - 1].chapter) {
      tl.addLabel(CHAPTER_MARK[sc.chapter], sc.t);
    }
    if (sc.index > 0) {
      // 分镜切换：一次白闪 + 音��，画面硬切
      tl.fromTo(flashEl, { opacity: 0 }, { opacity: .28, duration: .07, ease: 'power2.out', immediateRender: false }, sc.t - .04)
        .to(flashEl, { opacity: 0, duration: .34, ease: 'power2.in' }, sc.t + .03);
      OM.sfx(sc.index % 3 === 0 ? 'whoosh' : (sc.index % 3 === 1 ? 'hit' : 'glitch'), sc.t, { gain: .5, dur: .45 });
    }
  });

  blocks.forEach(b => {
    const sc = b.shot, ln = b.line;
    const at = sc.t + ln.at;
    // 退场：既要留出呼吸，也不能压到下一行文案进场
    const idx = sc.lines.indexOf(ln);
    const next = sc.lines[idx + 1];
    const out = Math.min(sc.end - 1.4, at + (sc.dur - ln.at) * .78,
                         next ? sc.t + next.at - .6 : Infinity,
                         ln.out != null ? sc.t + ln.out : Infinity);
    tl.fromTo(b.inner, { opacity: 0, x: -34 }, { opacity: 1, x: 0, duration: .5, immediateRender: false }, at);
    if (b.kick) tl.fromTo(b.kick, { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: .5, immediateRender: false }, at);
    tl.fromTo(b.chars, { yPercent: 140 }, { yPercent: 0, duration: .85, stagger: .026, ease: 'expo.out', immediateRender: false }, at + .12);
    if (b.sub) tl.fromTo(b.sub, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .7, immediateRender: false }, at + .55);
    tl.to(b.inner, { opacity: 0, duration: .55 }, out);
    if (b.kick) tl.to(b.kick, { opacity: 0, duration: .4 }, out);
    tl.to(b.chars, { yPercent: -140, duration: .6, stagger: .018, ease: 'power2.in' }, out);
    if (b.sub) tl.to(b.sub, { opacity: 0, duration: .4 }, out);
    const land = at + .12 + .85 + .026 * Math.max(0, (ln.head || '').length - 1);
    if (ln.kicker) OM.sfx('tick', at + .05, { gain: .25 });
    OM.sfx('pop', land, { gain: .34, note: 3 });
  });

  /* 章节指示器 */
  const chapterStart = sc => sc.t;
  SHOTS.forEach(sc => {
    if (sc.index === 0) return;
    const prev = SHOTS[sc.index - 1];
    if (prev.chapter !== sc.chapter) {
      tl.fromTo(huds[sc.chapter], { opacity: 0 }, { opacity: 1, duration: .5 }, sc.t);
      tl.to(huds[prev.chapter], { opacity: 0, duration: .5 }, sc.t);
    }
  });

  /* 尾卡 */
  const endcard = document.querySelector('.endcard');
  gsap.set(endcard, { opacity: 0 });
  document.querySelector('.endcard__cta').textContent = V.cta;
  document.querySelector('.endcard__url').textContent = V.url;
  document.querySelector('.endcard__brand').textContent = V.brand;
  document.querySelector('.hud__tl').textContent = V.brand;

  const joinShot = SHOTS[SHOTS.length - 1];
  tl.fromTo(endcard, { opacity: 0 }, { opacity: 1, duration: 1.1 }, joinShot.end - 11)
    .fromTo('.endcard__mark', { opacity: 0, scale: .6, rotation: -20 }, { opacity: 1, scale: 1, rotation: 0, duration: .9, ease: 'expo.out', immediateRender: false }, joinShot.end - 10.9)
    .fromTo('.endcard__brand', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .9, ease: 'expo.out', immediateRender: false }, joinShot.end - 10.7)
    .fromTo('.endcard__cta', { opacity: 0, y: 18, scale: .96 }, { opacity: 1, y: 0, scale: 1, duration: .7, ease: 'expo.out', immediateRender: false }, joinShot.end - 10)
    .fromTo('.endcard__url', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: .7, immediateRender: false }, joinShot.end - 9.8)
    .fromTo('.endcard__brand', { letterSpacing: '.06em' }, { letterSpacing: '.2em', duration: 1.2, ease: 'expo.out' }, joinShot.end - 9)
    .to({}, { duration: V.endHold });

  OM.sfx('stamp', joinShot.end - 9, { gain: .7 });
  OM.sfx('ding', joinShot.end - 8.9, { gain: .4, note: 5 });

  OM.clock(tl, draw, TOTAL);

  /* 分镜计数器（HUD 右上）：用 timeline 的 onUpdate 更新（纯时间函数） */
  let lastShot = -1;
  const counter = { v: 0 };
  tl.to(counter, {
    v: 1, duration: TOTAL, ease: 'none',
    onUpdate: () => {
      const s = shotAt(counter.v * TOTAL);
      if (s.index !== lastShot) {
        lastShot = s.index;
        shotEl.textContent = pad2(s.index + 1) + ' / ' + pad2(SHOTS.length);
      }
    }
  }, 0);

  function pad2(n) { return String(n).padStart(2, '0'); }

  window.__timelines['film5'] = tl;
})();
</script>
