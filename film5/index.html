<style>
  :root{
    --ink:#eaf6ff; --void:#03050c;
    --cyan:#4de3ff; --violet:#a06bff; --magenta:#ff7bd5; --gold:#ffb765;
    --muted:#9db3cd;
  }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--void); }
  #film {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 45%, #0a1226 0%, #05070f 52%, #02030a 100%);
    color: var(--ink); font-family: "Noto Sans SC", "Inter", system-ui, sans-serif; font-weight: 500;
  }
  #field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* 左侧渐变遮罩：与站点 .sw-copylayer::before 同一套参数
     —— 背后的网络依然活着，只是被压暗；文字永远压得住底 */
  .scrim {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(90deg,
      rgba(5,7,15,.94) 0%, rgba(5,7,15,.82) 30%, rgba(5,7,15,.42) 60%, transparent 100%);
  }
  .grain {
    position: absolute; inset: 0; pointer-events: none; opacity: .4; mix-blend-mode: overlay;
    background-image: radial-gradient(rgba(255,255,255,.09) .5px, transparent .5px); background-size: 3px 3px;
  }

  /* ---------------- HUD ---------------- */
  .hud { position: absolute; inset: 0; pointer-events: none; font-family: "Roboto Condensed", "Inter", monospace;
         text-shadow: 0 1px 14px rgba(2,5,12,.95), 0 0 3px rgba(2,5,12,.9); }
  .hud__tl { position: absolute; left: 56px; top: 44px; font-size: 20px; letter-spacing: .42em; color: #b6c9e0; }
  .hud__tr { position: absolute; right: 56px; top: 44px; font-size: 18px; letter-spacing: .26em; color: #adc0d8; }
  .hud__bl { position: absolute; left: 56px; bottom: 40px; font-size: 19px; letter-spacing: .24em; color: #aec2da; }
  .hud__ch { position: absolute; left: 56px; bottom: 40px; font-size: 19px; letter-spacing: .24em; opacity: 0; }
  .hud__ch b { font-weight: 700; }
  .hud__dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 12px;
              background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
  .hud__shot { position: absolute; right: 56px; bottom: 40px; font-size: 17px; letter-spacing: .2em; color: #9db2cd; }

  /* ==========================================================
     呼出框 · 信号卡
     继承站点「加入」弹框的基因：深色玻璃面板 + 1px 内描边 + 顶部三色细线
     从中间向两侧画出 + 面板晚于压暗一点点出现（错峰）
     ========================================================== */
  .co {
    position: absolute; left: 88px; top: 50%; width: 620px;
    padding: 30px 34px 32px; border-radius: 4px;
    background: linear-gradient(180deg, rgba(8,12,22,.62), rgba(5,8,16,.70));
    border: 1px solid rgba(234,246,255,.10);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
    opacity: 0; pointer-events: none; will-change: transform, opacity, filter;
  }
  /* 框外的一层柔光：让框从粒子场里浮出来（渐变，不用 blur 滤镜 —— 全屏 backdrop 会掉帧） */
  .co::after {
    content: ""; position: absolute; inset: -22% -18% -26% -20%; z-index: -1; pointer-events: none;
    background: radial-gradient(54% 58% at 30% 48%, var(--glow), transparent 74%);
    opacity: .8;
  }
  .co__bar {
    position: absolute; top: 0; left: 24px; right: 24px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, var(--c1), var(--c2) 52%, var(--c3));
    transform: scaleX(.28); opacity: 0; transform-origin: 50% 50%;
  }
  .co__meta { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 22px; }
  .co__eyebrow { font-family: "Roboto Condensed", "Inter", monospace; font-size: 20px; letter-spacing: .26em; color: var(--c2); }
  .co__num { font-family: "Roboto Condensed", "Inter", monospace; font-size: 17px; letter-spacing: .2em; color: rgba(157,179,205,.68); }
  .co__title {
    margin: 0; font-size: 50px; line-height: 1.26; font-weight: 900; letter-spacing: -.015em;
    text-shadow: 0 2px 34px rgba(0,0,0,.85), 0 0 60px var(--glow);
  }
  .co__body {
    margin: 20px 0 0; font-size: 25px; line-height: 1.66; color: rgba(234,246,255,.72);
    text-shadow: 0 1px 18px rgba(0,0,0,.9);
  }

  /* ---------------- 尾卡 = 站点的「加入」弹框，实体化 ---------------- */
  .endcard { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; }
  .endcard__panel {
    position: relative; width: 620px; padding: 44px 46px 40px; border-radius: 22px; text-align: center;
    background: linear-gradient(180deg, rgba(13,19,34,.97), rgba(6,10,20,.98));
    border: 1px solid rgba(234,246,255,.13);
    box-shadow: 0 40px 120px rgba(0,0,0,.72), 0 0 90px rgba(77,227,255,.10), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .endcard__bar {
    position: absolute; top: 0; left: 22px; right: 22px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, var(--cyan), var(--violet) 52%, var(--gold));
    transform: scaleX(.35); opacity: 0; transform-origin: 50% 50%;
  }
  .endcard__mark {
    width: 76px; height: 76px; border-radius: 20px; margin: 0 auto 30px;
    background: linear-gradient(150deg, var(--cyan), var(--violet) 55%, var(--gold));
    box-shadow: 0 0 64px rgba(77,227,255,.4);
  }
  .endcard__brand { font-family: "Inter", sans-serif; font-weight: 800; font-size: 82px; letter-spacing: .1em; line-height: 1; }
  .endcard__body { margin: 26px 0 0; font-size: 25px; line-height: 1.7; color: var(--muted); }
  .endcard__row { display: flex; align-items: center; justify-content: center; gap: 26px; margin-top: 38px; }
  .endcard__cta {
    font-size: 30px; font-weight: 500; color: #04070e; padding: 14px 44px; border-radius: 999px;
    background: linear-gradient(120deg, var(--cyan), var(--violet));
    box-shadow: 0 12px 40px rgba(77,227,255,.28);
  }
  .endcard__url { font-family: "Roboto Condensed", sans-serif; font-size: 30px; letter-spacing: .18em; color: #b3c6dd; }
</style>

<script>
(() => {
  const V = OM.vars();
  const W = 1920, H = 1080, TAU = Math.PI * 2;
  const CX = 90, CY = 0;       // 形态坐标以画面中心为原点；略偏右，给左侧文案留呼吸
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const clamp01 = v => clamp(v, 0, 1);
  const smooth = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
  const mix = (a, b, t) => a + (b - a) * t;
  const hex = h => { const s = h.replace('#',''); return [parseInt(s.slice(0,2),16)/255, parseInt(s.slice(2,4),16)/255, parseInt(s.slice(4,6),16)/255]; };

  /* ================================================================
     渲染层：与站点 site/assets/js/field.js 同源
     —— 同样的 GLSL 着色器、同样的三色连续调色板、同样的软光点与细连线
     —— 区别只有一个：粒子的位置是**时间的纯函数**（影片必须可复现）
     ================================================================ */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function makeNoise(seed) {
    const rnd = mulberry32(seed);
    const SIZE = 256, MASK = 255, perm = new Uint8Array(SIZE);
    for (let i = 0; i < SIZE; i++) perm[i] = i;
    for (let i = SIZE - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
    const grad = new Float32Array(SIZE * 2);
    for (let i = 0; i < SIZE; i++) { const a = (i / SIZE) * TAU; grad[i * 2] = Math.cos(a); grad[i * 2 + 1] = Math.sin(a); }
    const hash = (x, y) => perm[(x & MASK) + y] & MASK;
    const dot = (ix, iy, dx, dy) => {
      const h = hash(ix, iy) * 2;
      return grad[h] * dx + grad[h + 1] * dy;
    };
    return function (x, y) {
      const x0 = Math.floor(x), y0 = Math.floor(y);
      const u = x - x0, v = y - y0;
      const fx = u * u * (3 - 2 * u), fy = v * v * (3 - 2 * v);
      const n00 = dot(x0, y0, u, v);
      const n10 = dot(x0 + 1, y0, u - 1, v);
      const n01 = dot(x0, y0 + 1, u, v - 1);
      const n11 = dot(x0 + 1, y0 + 1, u - 1, v - 1);
      return mix(mix(n00, n10, fx), mix(n01, n11, fx), fy) * 0.7;
    };
  }
  const noise = makeNoise(20261020);

  const GLSL_PAL = `
    vec3 palette(float h, vec3 c1, vec3 c2, vec3 c3){
      h = clamp(h, 0.0, 1.0);
      vec3 c = mix(c1, c2, clamp(h * 2.0, 0.0, 1.0));
      return mix(c, c3, clamp(h * 2.0 - 1.0, 0.0, 1.0));
    }`;
  function compile(gl, type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) { const log = gl.getShaderInfoLog(sh); gl.deleteShader(sh); throw new Error('shader: ' + log); }
    return sh;
  }
  function makeProgram(gl, vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { const log = gl.getProgramInfoLog(p); gl.deleteProgram(p); throw new Error('link: ' + log); }
    return p;
  }
  function WebGLRenderer(canvas) {
    const gl = canvas.getContext('webgl2', {
      alpha: true, antialias: false, premultipliedAlpha: false,
      powerPreference: 'high-performance', depth: false, stencil: false
    });
    if (!gl) return null;
    this.gl = gl;
    const VS_POINT = `#version 300 es
      in vec2 aPos; in vec3 aAttr;
      uniform vec2 uRes; uniform float uDpr;
      out float vHue; out float vAlpha;
      void main(){
        vec2 p = (aPos / uRes) * 2.0 - 1.0;
        p.y = -p.y;
        gl_Position = vec4(p, 0.0, 1.0);
        gl_PointSize = max(3.0, aAttr.x * uDpr);
        vHue = aAttr.y; vAlpha = aAttr.z;
      }`;
    const VS_LINE = `#version 300 es
      in vec2 aPos; in vec2 aAttr;
      uniform vec2 uRes;
      out float vHue; out float vAlpha;
      void main(){
        vec2 p = (aPos / uRes) * 2.0 - 1.0;
        p.y = -p.y;
        gl_Position = vec4(p, 0.0, 1.0);
        vHue = aAttr.x; vAlpha = aAttr.y;
      }`;
    const FS_POINT = `#version 300 es
      precision mediump float;
      in float vHue; in float vAlpha;
      uniform vec3 uC1; uniform vec3 uC2; uniform vec3 uC3;
      out vec4 outColor;
      ${GLSL_PAL}
      void main(){
        vec3 col = palette(vHue, uC1, uC2, uC3);
        float d = length(gl_PointCoord - vec2(0.5)) * 2.0;
        float a = pow(max(0.0, 1.0 - d), 2.4);
        float w = clamp(vAlpha, 0.0, 1.0) * a;
        outColor = vec4(col * w, w);
      }`;
    const FS_LINE = `#version 300 es
      precision mediump float;
      in float vHue; in float vAlpha;
      uniform vec3 uC1; uniform vec3 uC2; uniform vec3 uC3;
      out vec4 outColor;
      ${GLSL_PAL}
      void main(){
        vec3 col = palette(vHue, uC1, uC2, uC3);
        float w = clamp(vAlpha, 0.0, 1.0);
        outColor = vec4(col * w, w);
      }`;

    this.progLine = makeProgram(gl, VS_LINE, FS_LINE);
    const loc = (prog, name) => gl.getUniformLocation(prog, name);
    this.uPoint = { res: loc(this.progPoint,'uRes'), dpr: loc(this.progPoint,'uDpr'),
                    c1: loc(this.progPoint,'uC1'), c2: loc(this.progPoint,'uC2'), c3: loc(this.progPoint,'uC3') };
    this.uLine = { res: loc(this.progLine,'uRes'),
                   c1: loc(this.progLine,'uC1'), c2: loc(this.progLine,'uC2'), c3: loc(this.progLine,'uC3') };
    this.aPointLoc = { pos: gl.getAttribLocation(this.progPoint,'aPos'), attr: gl.getAttribLocation(this.progPoint,'aAttr') };
    this.bufPointPos = gl.createBuffer(); this.bufPointAttr = gl.createBuffer();
    this.aLineLoc = { pos: gl.getAttribLocation(this.progLine,'aPos'), attr: gl.getAttribLocation(this.progLine,'aAttr') };
    this.bufLine = gl.createBuffer();
    this.lineCapacity = 0; this.ok = true;
  }
  WebGLRenderer.prototype.resize = function (w, h) {
    const gl = this.gl; this.w = w; this.h = h;
    gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
    gl.disable(gl.DEPTH_TEST); gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);           // 预乘加色混合

  WebGLRenderer.prototype.begin = function () {

  };
  WebGLRenderer.prototype.setPalette = function (c1, c2, c3) { this._c1 = c1; this._c2 = c2; this._c3 = c3; };
  WebGLRenderer.prototype.drawLines = function (buf, count) {
    if (!count) return;
    const gl = this.gl;
    gl.useProgram(this.progLine);
    gl.uniform2f(this.uLine.res, this.w, this.h);
    gl.uniform3fv(this.uLine.c1, this._c1); gl.uniform3fv(this.uLine.c2, this._c2); gl.uniform3fv(this.uLine.c3, this._c3);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.bufLine);
    const need = count * 8;
    if (need > this.lineCapacity) { this.lineCapacity = Math.ceil(need * 1.5); gl.bufferData(gl.ARRAY_BUFFER, this.lineCapacity * 4, gl.DYNAMIC_DRAW); }
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, buf, 0, need);

    gl.vertexAttribPointer(this.aLineLoc.pos, 2, gl.FLOAT, false, stride, 0);
    gl.enableVertexAttribArray(this.aLineLoc.attr);
    gl.vertexAttribPointer(this.aLineLoc.attr, 2, gl.FLOAT, false, stride, 8);
    gl.drawArrays(gl.LINES, 0, count * 2);
  };
  WebGLRenderer.prototype.drawPoints = function (posBuf, attrBuf, count, dpr) {
    if (!count) return;
    const gl = this.gl;
    gl.useProgram(this.progPoint);
    gl.uniform2f(this.uPoint.res, this.w, this.h);
    gl.uniform1f(this.uPoint.dpr, dpr);
    gl.uniform3fv(this.uPoint.c1, this._c1); gl.uniform3fv(this.uPoint.c2, this._c2); gl.uniform3fv(this.uPoint.c3, this._c3);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.bufPointPos);
    gl.bufferData(gl.ARRAY_BUFFER, posBuf.subarray(0, count * 2), gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(this.aPointLoc.pos);
    gl.vertexAttribPointer(this.aPointLoc.pos, 2, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.bufPointAttr);
    gl.bufferData(gl.ARRAY_BUFFER, attrBuf.subarray(0, count * 3), gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(this.aPointLoc.attr);
    gl.vertexAttribPointer(this.aPointLoc.attr, 3, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.POINTS, 0, count);
  };

     ================================================================ */

  const MAX = 4400, COUNT = 3400, MAX_LINES = 12000;

    pcluster[i] = (rnd() * 4) | 0;

    pkind[i] = r < 0.58 ? KIND_World : r < 0.76 ? KIND_AI : r < 0.93 ? KIND_Human : KIND_Core;
    phue[i] = pkind[i] === KIND_AI ? 0.62 + rnd() * 0.3
            : pkind[i] === KIND_Human ? 0.02 + rnd() * 0.22

  /* ================================================================
     19 个分镜的目标形态
     —— 语法继承站点的 targetOf：同一批粒子（u/v/kind/cluster）被"吸引"到不同形状
     ================================================================ */
  const RAD = Math.min(W, H) * 0.52;

  /* ---------------------------------------------------------------
     底形态：直接继承站点的 6 个体积形态（粒子填满一整个体量 → 满屏的网）
     坐标以画面中心为原点，0,0 = 中心
     --------------------------------------------------------------- */
  const BASE = {
    // 星云球
    sphere(i, t, o) {
      const a = pu[i] * TAU, rr = RAD * (0.20 + 0.80 * Math.sqrt(pv[i]));
      o[0] = CX + Math.cos(a) * rr * 1.34;
      o[1] = CY + Math.sin(a) * rr * 0.76;
    },
    // 双极：两团相对
    bipolar(i, t, o) {
      const v = pv[i];
      const side = pkind[i] === KIND_AI ? -1 : pkind[i] === KIND_Human ? 1 : (v < 0.5 ? -1 : 1);
      const a = pu[i] * TAU, rr = RAD * (0.20 + 0.40 * Math.sqrt(v));
      o[0] = CX + side * RAD * 0.86 + Math.cos(a) * rr * 0.62;
      o[1] = CY + Math.sin(a) * rr * 0.95;
    },
    // 双格栅：两个网格相对，中间一条交换带
    lattice(i, t, o) {
      const u = pu[i], v = pv[i];
      const side = v < 0.5 ? -1 : 1;
      if (u < 0.74) {
        const col = (Math.floor((u / 0.74) * 5) + 0.5) / 5 + (pjit[i] - 0.5) * 0.16;
        const row = (pcluster[i] + 0.5) / 4 + (pjit2[i] - 0.5) * 0.30;
        o[0] = CX + side * RAD * 0.62 + (col - 0.5) * RAD * 0.86;
        o[1] = CY + (row - 0.5) * RAD * 1.26;
      } else {
        const q = (u - 0.74) / 0.26;
        o[0] = CX + (q - 0.5) * RAD * 1.30;
        o[1] = CY + ((pcluster[i] + 0.5) / 4 - 0.5) * RAD * 0.52;
      }
    },
    // 簇群：四个星团
    cluster(i, t, o) {
      const a = pu[i] * TAU, rr = RAD * (0.14 + 0.30 * Math.sqrt(pv[i]));
      const n = 4, idx = pcluster[i] % n;
      const ang = (idx / n) * TAU + 0.6;
      const cxx = CX + Math.cos(ang) * RAD * 0.62, cyy = CY + Math.sin(ang) * RAD * 0.44;
      o[0] = cxx + Math.cos(a) * rr * 1.22;
      o[1] = cyy + Math.sin(a) * rr;
    },
    // 壳：球面
    shell(i, t, o) {
      const a = pu[i] * TAU, ph = Math.acos(2 * pv[i] - 1);
      o[0] = CX + Math.sin(ph) * Math.cos(a) * RAD;
      o[1] = CY + Math.sin(ph) * Math.sin(a) * RAD * 0.9;
    },
    // 拱门
    gate(i, t, o) {
      const u = pu[i], v = pv[i];
      if (v < 0.62) {
        const th = Math.PI * u;
        o[0] = CX + Math.cos(th) * RAD * 1.02;
        o[1] = CY - RAD * 0.62 * Math.sin(th) + RAD * 0.06;
      } else {
        const side = u < 0.5 ? -1 : 1;
        o[0] = CX + side * RAD * 1.02;
        o[1] = CY + RAD * 0.06 + v * RAD * 0.86;
      }
    }
  };

  /* ---------------------------------------------------------------
     分镜特征层：一部分粒子被"借"去构成这个分镜的标志物
     返回 true = 这个粒子归特征层管，其余走底形态
     --------------------------------------------------------------- */
  const SH = {};
  // 00 起点：一点炸成回声涟漪（底形态的球从一点长开）
  SH.ignite = (i, t, o) => {
    if (t < 2.6) {
      const k = t / 2.6, a = pu[i] * TAU, R = k * 620 + 10;
      o[0] = CX + Math.cos(a) * R * 1.32;
      o[1] = CY + Math.sin(a) * R * 0.68;
      return true;
    }
    return false;
  };
  // 01 追问：一道弧在两极之间来回，话出去又回来
  SH.ask = (i, t, o) => {
    if (psel[i] < 0.26) {
      const p = (t * 0.46 + pu[i] * 0.30) % 1;
      const q = Math.abs(p - 0.5) * 2, dir = p < 0.5 ? 1 : -1;
      const spread = (pjit[i] - 0.5) * RAD * 0.10;
      o[0] = CX + dir * mix(-RAD * 0.86, RAD * 0.86, q) + spread;
      o[1] = CY - RAD * 0.46 * Math.sin(q * Math.PI) - RAD * 0.10 + spread * 0.4;

      const head = Math.floor(t * 0.5) % rows;
      const on = (row - head + rows) % rows < 2;
      const w = 0.30 + 0.55 * Math.abs(Math.sin(row * 2.399 + (col > 0 ? 1.1 : 0)));
      o[0] = CX + col * RAD * (0.26 + pu[i] * w * 1.5);
      o[1] = CY - RAD * 0.68 + row * (RAD * 0.27) + (on ? -RAD * 0.03 : RAD * 0.03);
      return true;
    }
    return false;
  };

  SH.rebut = (i, t, o) => {

      const a = pjit2[i] * TAU, rr = RAD * 0.13 * Math.sqrt(pv[i]);
      o[0] = CX + side * RAD * 0.86 * push + Math.cos(a) * rr;

      return true;
    }
    return false;
  };
  // 04 记得：一圈记忆节点按序点亮
  SH.remember = (i, t, o) => {
    if (psel[i] < 0.26) {
      const a = pu[i] * TAU, R = RAD * (0.92 + 0.16 * pjit[i]);
      const head = (t * 0.34) % 1;
      const d = Math.abs(((pu[i] - head) % 1 + 1) % 1);
      const on = d < 0.06;
      o[0] = CX + Math.cos(a) * R * 1.18;
      o[1] = CY + Math.sin(a) * R * 0.80 + (on ? -RAD * 0.025 : RAD * 0.02);
      return true;
    }
    return false;
  };
  // 05 边界：一条清晰的界线，线外的粒子被挡在外面

    if (psel[i] < 0.10) {
      o[0] = CX - RAD * 0.40 + pu[i] * RAD * 0.80;
      o[1] = CY + (pjit[i] - 0.5) * RAD * 0.04;
      return true;
    }
    if (psel[i] < 0.26) {                // 界线左边：被挡在外面
      const a = pjit2[i] * TAU, rr = RAD * 0.22 * Math.sqrt(pv[i]);
      o[0] = CX - RAD * 0.78 - Math.abs(Math.cos(a)) * rr;

      const q = prog * 2 - seg;
      const spread = (pjit[i] - 0.5) * RAD * 0.05;   // 光是一小簇，不是一个白点

    if (psel[i] < 0.30) {

      o[0] = CX + mix(-RAD * 0.88, RAD * 0.88, p);
      o[1] = CY + Math.sin(p * Math.PI) * (pv[i] / 0.32) * RAD * 0.36 - RAD * 0.10;

      return true;

  SH.join = () => false;

        body:'凌晨三点，四个人为同一个问题，谁都不肯先睡。' }, cam:[{z:1.05,x:0,y:0},{z:.97,x:0,y:0}] },
    { id:'stranger', base:'bipolar', dur:16, shape:'stranger', ch:3, card:{ eyebrow:'三 · 人与人', title:'你帮过一个陌生人',
        body:'他不会告诉你他是谁，也不会再出现。' }, cam:[{z:1.0,x:0,y:0},{z:1.05,x:0,y:0}] },
    { id:'warmth', base:'cluster', dur:16, shape:'warmth', ch:3, card:{ eyebrow:'三 · 人与人', title:'连接建立得很慢',
        body:'但一旦连上，就很难被切断。' }, cam:[{z:1.0,x:0,y:0},{z:1.06,x:0,y:0}] },

    { id:'emerge', base:'shell', dur:20, shape:'emerge', ch:4, card:{ eyebrow:'犹如三生万物', title:'犹如三生万物',
        body:'三种关系同时发生，新的东西自己长出来。' }, cam:[{z:1.0,x:0,y:0},{z:.92,x:0,y:0}] },
    { id:'notmade', base:'sphere', dur:20, shape:'notmade', ch:4, card:{ eyebrow:'犹如三生万物', title:'万物不是被造出来的，是被关系带出来的',
        body:'它只需要被连接。' }, cam:[{z:.95,x:0,y:0},{z:1.0,x:0,y:0}] },

    { id:'join', base:'gate', dur:30, shape:'join', ch:5, card:{ eyebrow:'加入我们', title:'让你的回声，被更多节点听见',
        body:'进来，把你的节点接上。' },
      cam:[{z:1.0,x:0,y:0},{z:1.08,x:0,y:0}] }
  ];

  let acc = 0;
  SHOTS.forEach((s, i) => { s.t = acc; s.end = acc + s.dur; acc += s.dur; s.index = i; });
  const TOTAL = acc;
  function shotAt(t) {
    for (let k = SHOTS.length - 1; k >= 0; k--) if (t >= SHOTS[k].t) return SHOTS[k];
    return SHOTS[0];
  }

  /* ================================================================
     渲染：每帧都是时间的纯函数
     ================================================================ */
  const canvas = document.getElementById('field');
  const renderer = new WebGLRenderer(canvas);
  const GL = renderer && renderer.ok;
  if (GL) renderer.resize(W, H);
  const ctx2d = GL ? null : canvas.getContext('2d');
  const sprite = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 48;
    const g = c.getContext('2d');
    const rg = g.createRadialGradient(24,24,0,24,24,24);
    rg.addColorStop(0,'rgba(255,255,255,1)'); rg.addColorStop(.22,'rgba(255,255,255,.55)');
    rg.addColorStop(.55,'rgba(255,255,255,.13)'); rg.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle = rg; g.fillRect(0,0,48,48);
    return c;
  })();

  const cur = [0,0], prev = [0,0], tmpA = [0,0], tmpB = [0,0];
  const MORPH = 0.95;                      // 分镜之间的形态接力时长
  const flowT = t => t * 0.115;

  function draw(t) {
    const sc = shotAt(t);
    const local = t - sc.t;
    const prevSc = sc.index > 0 ? SHOTS[sc.index - 1] : sc;
    const m = sc.index > 0 ? smooth(clamp01(local / MORPH)) : 1;
    const prevLocal = prevSc === sc ? local : prevSc.dur + (local - MORPH);

    // 章节调色板与连线参数：章节内不变，章节切换时交叉溶解
    const chA = CHAPTERS[prevSc.ch], chB = CHAPTERS[sc.ch];
    const chM = sc.ch === prevSc.ch ? 1 : smooth(clamp01((local + (sc.index > 0 ? 0 : 0)) / 1.6));
    const p1 = hexMix(palCache[prevSc.ch][0], palCache[sc.ch][0], chM);
    const p2 = hexMix(palCache[prevSc.ch][1], palCache[sc.ch][1], chM);
    const p3 = hexMix(palCache[prevSc.ch][2], palCache[sc.ch][2], chM);
    const link = mix(chA.link, chB.link, chM) * (0.9 + chB.energy * 0.22);
    const linkAlpha = mix(chA.linkAlpha, chB.linkAlpha, chM);
    const sizeMul = mix(chA.size, chB.size, chM) * (0.92 + chB.energy * 0.3);
    const flowAmp = mix(chA.flow, chB.flow, chM);
    const energy = mix(chA.energy, chB.energy, chM);

    // 镜头
    const ca = sc.cam[0], cb = sc.cam[1];
    const f = smooth(clamp01(local / Math.max(.001, sc.dur)));
    let zoom = mix(ca.z, cb.z, f), camX = mix(ca.x, cb.x, f), camY = mix(ca.y, cb.y, f);
    // 转场时的一次"呼吸"：先退 2.5%，再进 2%
    if (sc.index > 0 && local < MORPH) {
      const b = Math.sin(clamp01(local / MORPH) * Math.PI);
      zoom *= 1 - b * 0.025;
    }

    const ft = flowT(t);
    const wave = (t * 0.26) % 1;               // 一道从左往右扫过全场的信号带
    // 切点亮度下沉：0.5s 内从 0.6 回到 1，像胶片的一次呼吸，但绝不做白闪
    let edge = 1;
    for (let k = 1; k < SHOTS.length; k++) {
      const d = Math.abs(t - SHOTS[k].t);
      if (d < 0.5) edge = Math.min(edge, 0.58 + 0.42 * (d / 0.5));
    }

    // 粒子位置
    const base = BASE[sc.base], pbase = BASE[prevSc.base];
    for (let i = 0; i < COUNT; i++) {
      if (!SH[sc.shape](i, local, cur)) base(i, local, cur);
      if (m < 1) {
        if (!SH[prevSc.shape](i, prevLocal, prev)) pbase(i, prevLocal, prev);
        cur[0] = mix(prev[0], cur[0], m);
        cur[1] = mix(prev[1], cur[1], m);
      }
      let x = cur[0], y = cur[1];
      // 流场：站点的"力"在这里直接变成位移 —— 形态因此化成一团缓慢游走的雾，
      // 而不是一圈硬边；粒子被摊开满屏，就是网页那种稀疏的星座感
      const n1 = noise(x * 0.0017 + ft, y * 0.0017 - ft * 0.7);
      const n2 = noise(x * 0.0017 + 41.3 - ft * 0.5, y * 0.0017 + 17.9 + ft);
      x += n1 * 74 * flowAmp; y += n2 * 74 * flowAmp;
      // 每颗粒子自己的轨道
      const ang = pjit2[i] * TAU + t * (0.6 + pjit[i] * 1.3);
      const orb = 12 + pjit[i] * 34;
      x += Math.cos(ang) * orb; y += Math.sin(ang * 1.13) * orb;
      // 高频微抖：幅度只有几像素（形态不糊），但每帧都在变
      // —— 网页的粒子每帧能走 7px，影片没有惯性，就必须用这个补上"活着"的感觉
      const jx = Math.sin(t * 17.1 + pjit[i] * 41.7) * 13;
      const jy = Math.cos(t * 15.3 + pjit2[i] * 27.3) * 12;
      x += jx; y += jy;

      // 镜头
      const sx = (x - camX) * zoom + W * 0.5;
      const sy = (y - camY) * zoom + H * 0.5;

      posBuf[i * 2] = sx; posBuf[i * 2 + 1] = sy;
      const scanX = CX - RAD * 1.7 + wave * RAD * 3.4;   // 扫描带的位置
      const charge = Math.max(0, 1 - Math.abs(x - scanX) / (RAD * 0.42));
      const hot = charge * charge;
      attrBuf[i * 3] = psize[i] * sizeMul * (1 + hot * 0.30);
      attrBuf[i * 3 + 1] = phue[i];
      attrBuf[i * 3 + 2] = (0.19 + hot * 0.26) * (0.78 + energy * 0.4) * edge;
    }

    // 连线
    const cell = Math.max(40, link);
    const cols = Math.ceil(W / cell) + 1, rows = Math.ceil(H / cell) + 1;
    if (head.length < cols * rows) { /* 固定 64x40 足够 */ }
    head.fill(-1);
    for (let i = 0; i < COUNT; i++) {
      const cx = clamp((posBuf[i * 2] / cell) | 0, 0, cols - 1);
      const cy = clamp((posBuf[i * 2 + 1] / cell) | 0, 0, rows - 1);
      const idx = cy * cols + cx;
      next[i] = head[idx]; head[idx] = i;
    }
    let ln = 0;
    const link2 = link * link;
    for (let i = 0; i < COUNT && ln < MAX_LINES; i++) {
      const cx = clamp((posBuf[i * 2] / cell) | 0, 0, cols - 1);
      const cy = clamp((posBuf[i * 2 + 1] / cell) | 0, 0, rows - 1);
      for (let oy = 0; oy <= 1; oy++) {
        for (let ox = -1; ox <= 1; ox++) {
          if (oy === 0 && ox < 0) continue;
          if (oy === 1 && ox === 1) continue;
          const nx = cx + ox, ny = cy + oy;
          if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
          let j = head[ny * cols + nx];
          while (j !== -1 && ln < MAX_LINES) {
            if (j > i) {
              const dx = posBuf[i * 2] - posBuf[j * 2], dy = posBuf[i * 2 + 1] - posBuf[j * 2 + 1];
              const d2 = dx * dx + dy * dy;
              if (d2 < link2) {
                const d = Math.sqrt(d2);
                let a = (1 - d / link) * linkAlpha * (0.8 + energy * 0.5) * 0.62 * edge;
                const o = ln * 8;
                lineBuf[o] = posBuf[i * 2]; lineBuf[o + 1] = posBuf[i * 2 + 1];
                lineBuf[o + 2] = phue[i]; lineBuf[o + 3] = a;
                lineBuf[o + 4] = posBuf[j * 2]; lineBuf[o + 5] = posBuf[j * 2 + 1];
                lineBuf[o + 6] = phue[j]; lineBuf[o + 7] = a;
                ln++;
              }
            }
            j = next[j];
          }
        }
      }
    }

    // 扩散波环（网页 field.js 的 shock ring）：每次换镜从中心推开一圈
    // 章节切换推得更大更久。它是"同一个世界在变形"的视觉证据
    for (let k = 1; k < SHOTS.length; k++) {
      const ts = SHOTS[k].t;
      const age = t - ts;
      if (age < 0 || age > 3.2) continue;
      const big = SHOTS[k].ch !== SHOTS[k - 1].ch;
      const maxR = (big ? 1.15 : 0.55) * Math.max(W, H);
      const r = 10 + (maxR / 3.2) * age;
      const alpha = Math.max(0, 1 - age * 0.32) * (big ? 0.42 : 0.24);
      const segs = 56;
      for (let sgi = 0; sgi < segs && ln < MAX_LINES; sgi++) {
        const a0 = (sgi / segs) * TAU, a1 = ((sgi + 1) / segs) * TAU;
        const o = ln * 8;
        lineBuf[o] = CX + W * 0.5 + Math.cos(a0) * r;
        lineBuf[o + 1] = CY + H * 0.5 + Math.sin(a0) * r;
        lineBuf[o + 2] = 0.55; lineBuf[o + 3] = alpha;
        lineBuf[o + 4] = CX + W * 0.5 + Math.cos(a1) * r;
        lineBuf[o + 5] = CY + H * 0.5 + Math.sin(a1) * r;
        lineBuf[o + 6] = 0.55; lineBuf[o + 7] = alpha;
        ln++;
      }
    }

    if (GL) {
      renderer.begin();
      renderer.setPalette(p1, p2, p3);
      renderer.drawLines(lineBuf, ln);
      renderer.drawPoints(posBuf, attrBuf, COUNT, 1);
    } else {
      ctx2d.clearRect(0, 0, W, H);
      ctx2d.globalCompositeOperation = 'lighter';
      ctx2d.strokeStyle = 'rgba(120,190,255,.18)';
      ctx2d.beginPath();
      for (let s = 0; s < ln; s++) { const o = s * 8; ctx2d.moveTo(lineBuf[o], lineBuf[o+1]); ctx2d.lineTo(lineBuf[o+4], lineBuf[o+5]); }
      ctx2d.stroke();
      for (let i = 0; i < COUNT; i++) {
        ctx2d.globalAlpha = attrBuf[i * 3 + 2];
        const r = attrBuf[i * 3] * 1.8;
        ctx2d.drawImage(sprite, posBuf[i*2] - r, posBuf[i*2+1] - r, r * 2, r * 2);
      }
      ctx2d.globalAlpha = 1;
      ctx2d.globalCompositeOperation = 'source-over';
    }
  }
  function hexMix(a, b, t) { return [mix(a[0],b[0],t), mix(a[1],b[1],t), mix(a[2],b[2],t)]; }

  /* ================================================================
     呼出框（信号卡）
     ================================================================ */
  const esc = c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' })[c] || c;
  const cardsHost = document.getElementById('cards');
  const cards = [];
  SHOTS.forEach(sc => {
    if (!sc.card) return;
    const el = document.createElement('div');
    el.className = 'co';
    el.setAttribute('data-layout-allow-occlusion', '');
    el.setAttribute('data-om-id', 'co-' + sc.id);
    el.style.setProperty('--c1', CHAPTERS[sc.ch].pal[0]);
    el.style.setProperty('--c2', CHAPTERS[sc.ch].pal[1]);
    el.style.setProperty('--c3', CHAPTERS[sc.ch].pal[2]);
    el.style.setProperty('--glow', hexToRgba(CHAPTERS[sc.ch].pal[1], .13));
    el.innerHTML =
      '<div class="co__bar"></div>' +
      '<div class="co__meta"><span class="co__eyebrow">' + esc(sc.card.eyebrow) + '</span>' +
      '<span class="co__num">' + String(sc.index + 1).padStart(2, '0') + ' / ' + SHOTS.length + '</span></div>' +
      '<h2 class="co__title">' + esc(sc.card.title) + '</h2>' +
      '<p class="co__body">' + esc(sc.card.body) + '</p>';
    cardsHost.appendChild(el);
    cards.push({ shot: sc, el,
      bar: el.querySelector('.co__bar'),
      title: el.querySelector('.co__title'),
      body: el.querySelector('.co__body') });
  });
  function hexToRgba(h, a) {
    const s = h.replace('#','');
    return 'rgba(' + parseInt(s.slice(0,2),16) + ',' + parseInt(s.slice(2,4),16) + ',' + parseInt(s.slice(4,6),16) + ',' + a + ')';
  }

  /* ================================================================
     时间轴
     ================================================================ */
  const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
  const huds = [...document.querySelectorAll('.hud__ch')];
  const shotEl = document.getElementById('hudShot');

  gsap.set(cards.map(c => c.el), { opacity: 0, y: 26, scale: .975 });
  gsap.set(cards.map(c => c.bar), { scaleX: .28, opacity: 0 });
  gsap.set(cards.map(c => c.title), { opacity: 0, y: 18 });
  gsap.set(cards.map(c => c.body), { opacity: 0, y: 14 });
  gsap.set(huds, { opacity: 0 });

  const CHAPTER_MARK = { 0:'hook', 1:'one', 2:'two', 3:'three', 4:'all', 5:'join' };

  SHOTS.forEach(sc => {
    tl.addLabel('scene:' + sc.id, sc.t);
    if (sc.index === 0 || sc.ch !== SHOTS[sc.index - 1].ch) {
      tl.addLabel(CHAPTER_MARK[sc.ch], sc.t);
    }
    if (sc.index > 0) {
      // 转场：形态接力（渲染层内做）+ 扩散波环（渲染层内做）+ 章节切换才有的重音
      const chapterCut = sc.ch !== SHOTS[sc.index - 1].ch;
      if (chapterCut) {
        OM.sfx('whoosh', sc.t - .12, { gain: .30, dur: .7 });
        OM.sfx('subdrop', sc.t + .16, { gain: .32 });
      }
    }
  });

  // 呼出框：整块入场 + 层次错峰（不逐字）
  cards.forEach(c => {
    const sc = c.shot;
    const at = sc.t + 2.4;
    const out = sc.id === 'join' ? sc.t + 13 : sc.end - 2.6;   // join 文案在尾卡出现前就走
    tl.fromTo(c.el, { opacity: 0, y: 26, scale: .975 },
      { opacity: 1, y: 0, scale: 1, duration: .62, ease: 'expo.out', immediateRender: false }, at);
    tl.fromTo(c.bar, { scaleX: .28, opacity: 0 },
      { scaleX: 1, opacity: .9, duration: .72, ease: 'expo.out', immediateRender: false }, at + .12);
    tl.fromTo(c.title, { opacity: 0, y: 18 },
      { opacity: 1, y: 0, duration: .70, ease: 'expo.out', immediateRender: false }, at + .18);
    tl.fromTo(c.body, { opacity: 0, y: 14 },
      { opacity: 1, y: 0, duration: .78, ease: 'expo.out', immediateRender: false }, at + .30);
    tl.to(c.el, { opacity: 0, y: -16, filter: 'blur(3px)', duration: .45, ease: 'power2.in' }, out);
    OM.sfx('pop', at + .05, { gain: .26 });
    // 意义的落点：给三处关键句一记低频
    if (sc.id === 'together' || sc.id === 'thread' || sc.id === 'rebut') OM.sfx('thud', at + .42, { gain: .26 });
    if (sc.id === 'emerge' || sc.id === 'notmade') OM.sfx('chime', at + .34, { gain: .20 });
  });

  /* 章节指示器 */
  SHOTS.forEach(sc => {
    if (sc.index === 0) return;
    const prevSc = SHOTS[sc.index - 1];
    if (prevSc.ch !== sc.ch) {
      tl.fromTo(huds[sc.ch], { opacity: 0 }, { opacity: 1, duration: .5 }, sc.t);
      tl.to(huds[prevSc.ch], { opacity: 0, duration: .5 }, sc.t);
    }
  });

  /* 尾卡 = 站点的「加入」弹框 */
  const endcard = document.querySelector('.endcard');
  const panel = endcard.querySelector('.endcard__panel');
  const ebar = endcard.querySelector('.endcard__bar');
  const emark = endcard.querySelector('.endcard__mark');
  const ebrand = endcard.querySelector('.endcard__brand');
  const ebody = endcard.querySelector('.endcard__body');
  const ecta = endcard.querySelector('.endcard__cta');
  const eurl = endcard.querySelector('.endcard__url');
  gsap.set(endcard, { opacity: 0 });
  ecta.textContent = V.cta; eurl.textContent = V.url; ebrand.textContent = V.brand;
  ebody.textContent = '这里有正在造 AI 的人，有正在和人机协作的团队，也有一群自己就会互相连接的智能体。';
  document.querySelector('.hud__tl').textContent = V.brand;

  const joinShot = SHOTS[SHOTS.length - 1];
  const ecAt = joinShot.end - 12;
  tl.fromTo(endcard, { opacity: 0 }, { opacity: 1, duration: 1.0 }, ecAt)
    .fromTo(panel, { opacity: 0, y: 22, scale: .975 }, { opacity: 1, y: 0, scale: 1, duration: .72, ease: 'expo.out', immediateRender: false }, ecAt + .18)
    .fromTo(ebar, { scaleX: .35, opacity: 0 }, { scaleX: 1, opacity: .9, duration: .74, ease: 'expo.out', immediateRender: false }, ecAt + .30)
    .fromTo(emark, { opacity: 0, scale: .6, rotation: -18 }, { opacity: 1, scale: 1, rotation: 0, duration: .9, ease: 'expo.out', immediateRender: false }, ecAt + .34)
    .fromTo(ebrand, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .86, ease: 'expo.out', immediateRender: false }, ecAt + .46)
    .fromTo(ebody, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .8, ease: 'expo.out', immediateRender: false }, ecAt + .60)
    .fromTo(ecta, { opacity: 0, y: 14, scale: .97 }, { opacity: 1, y: 0, scale: 1, duration: .7, ease: 'expo.out', immediateRender: false }, ecAt + .74)
    .fromTo(eurl, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .7, ease: 'expo.out', immediateRender: false }, ecAt + .80)
    .to({}, { duration: V.endHold });
  OM.sfx('impact', ecAt + .12, { gain: .46 });
  OM.sfx('chime', ecAt + .40, { gain: .22 });

  OM.clock(tl, draw, TOTAL);

  /* 分镜计数器 */
  let lastShot = -1;
  const counter = { v: 0 };
  tl.to(counter, { v: 1, duration: TOTAL, ease: 'none', onUpdate: () => {
    const s = shotAt(counter.v * TOTAL);
    if (s.index !== lastShot) {
      lastShot = s.index;
      shotEl.textContent = String(s.index + 1).padStart(2,'0') + ' / ' + SHOTS.length;
    }
  } }, 0);

  window.__timelines['film5'] = tl;
})();
</script>
</body>
</html>
