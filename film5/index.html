<script>
(() => {
  const V = OM.vars();
  const W = 1920, H = 1080, TAU = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const clamp01 = v => clamp(v, 0, 1);
  const smooth = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
  const mix = (a, b, t) => a + (b - a) * t;
  const rnd = OM.random(20261020);
  const hex = h => { const s = h.replace('#',''); return [parseInt(s.slice(0,2),16)/255, parseInt(s.slice(2,4),16)/255, parseInt(s.slice(4,6),16)/255]; };
  const css = (c, a) => `rgba(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)},${a})`;

  /* ==========================================================
     粒子
     ========================================================== */
  const N = 1500;
  const role = new Uint8Array(N);
  const pu = new Float32Array(N), pv = new Float32Array(N), pw = new Float32Array(N), pz = new Float32Array(N);
  const psize = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    pu[i] = rnd(); pv[i] = rnd(); pw[i] = rnd(); pz[i] = rnd();
    const r = rnd();
    role[i] = r < 0.13 ? 1 : r < 0.27 ? 2 : r < 0.36 ? 3 : r < 0.47 ? 4 : r < 0.51 ? 5 : 0;
    psize[i] = 1.1 + rnd() * 2.4 + (role[i] === 5 ? 2.6 : 0) + (role[i] === 0 ? 0.5 : 0);
  }
  const ROLE_COL = [null, hex(V.cHuman), hex(V.cAI), hex(V.cAI2), hex(V.cWarm), [1,1,1]];
  const ACCENT = { start: hex(V.cHuman), one: hex(V.cAI), two: hex(V.cAI2), three: hex(V.cWarm), all: hex(V.cHuman), join: hex(V.cAI) };

  const DRIFT_GAIN = 4.2;   // 5 分钟尺度上，形态停住后粒子仍要"活着"
  const drift = (i, t, amp, sp) => {
    const a = pu[i] * TAU, b = pv[i] * TAU;
    return [
      (Math.cos(a + t * sp) * amp + Math.cos(b + t * sp * 1.63) * amp * .7) * DRIFT_GAIN,
      (Math.sin(b * 1.3 + t * sp * .82) * amp + Math.sin(a * 1.87 + t * sp * 1.31) * amp * .7) * DRIFT_GAIN
    ];
  };
  const sideOf = i => (role[i] === 2 || role[i] === 3) ? -1 : (role[i] === 1 ? 1 : (pu[i] < .52 ? -1 : 1));

  /* ---------------- 形态变体 ---------------- */
  const SH = {};

  SH.ignite = [
    (i, t) => {
      if (t < 0.25) return [(pu[i] - .5) * 3, (pv[i] - .5) * 3];
      if (t < 2.1) {
        const k = (t - .25) / 1.85, ang = pu[i] * TAU, R = k * 620, th = (pv[i] - .5) * 46;
        const d = drift(i, t, 3, .8);
        return [Math.cos(ang) * (R + th) + d[0], Math.sin(ang) * (R + th) * .76 + d[1]];
      }
      const z = pz[i] * 2 - 1, rr = Math.sqrt(Math.max(0, 1 - z * z)), ang = pu[i] * TAU;
      const R = (0.18 + 0.82 * pv[i]) * 470, d = drift(i, t, 26, .55);
      return [Math.cos(ang) * rr * R * 1.3 + d[0], Math.sin(ang) * rr * R * .78 + d[1]];
    }
  ];

  SH.bipolar = [
    // v0 分开：两簇离得很远
    (i, t) => {
      const s = sideOf(i), ang = pu[i] * TAU, R = (0.12 + .88 * pv[i]) * 185;
      const d = drift(i, t, 20, .55);
      return [s * 430 + Math.cos(ang) * R * 1.25 + d[0], Math.sin(ang) * R + d[1]];
    },
    // v1 桥接：中间长出一条连线
    (i, t) => {
      const s = sideOf(i), ang = pu[i] * TAU, R = (0.12 + .88 * pv[i]) * 170;
      const d = drift(i, t, 20, .6);
      if (role[i] === 0 && pv[i] < .2) {
        const u = pw[i], y = (pv[i] / .2 - .5) * 130;
        return [mix(-330, 330, u) + d[0], y + d[1]];
      }
      return [s * 330 + Math.cos(ang) * R * 1.25 + d[0], Math.sin(ang) * R + d[1]];
    },
    // v2 对话脉冲：信号在两极之间往返
    (i, t) => {
      const s = sideOf(i), ang = pu[i] * TAU, R = (0.12 + .88 * pv[i]) * 165;
      const d = drift(i, t, 18, .6);
      if (role[i] === 0 && pv[i] < .22) {
        const phase = (t * .34 + pw[i]) % 1;
        const x = mix(-300, 300, phase);
        const y = (pv[i] / .22 - .5) * 120;
        return [x + d[0] * .5, y + d[1] * .5];
      }
      return [s * 300 + Math.cos(ang) * R * 1.25 + d[0], Math.sin(ang) * R + d[1]];
    },
    // v3 共享轨道：两簇绕共同中心转
    (i, t) => {
      const s = sideOf(i), ang = pu[i] * TAU, R = (0.12 + .88 * pv[i]) * 160;
      const a = t * .26 + (s < 0 ? Math.PI : 0);
      const d = drift(i, t, 16, .6);
      return [Math.cos(a) * 300 + Math.cos(ang) * R * 1.2 + d[0], Math.sin(a) * 200 + Math.sin(ang) * R + d[1]];
    },
    // v4 稳定：一层共同的环
    (i, t) => {
      const s = sideOf(i), ang = pu[i] * TAU, R = (0.12 + .88 * pv[i]) * 165;
      const d = drift(i, t, 16, .5);
      if (role[i] === 0 && pz[i] < .16) {
        const a2 = pu[i] * TAU, R2 = 400;
        return [Math.cos(a2) * R2 * 1.2 + d[0], Math.sin(a2) * R2 * .62 + d[1]];
      }
      return [s * 300 + Math.cos(ang) * R * 1.25 + d[0], Math.sin(ang) * R + d[1]];
    }
  ];

  SH.lattice = [
    (i, t) => gridShape(i, t, 0),
    (i, t) => gridShape(i, t, 1),
    (i, t) => gridShape(i, t, 2),
    (i, t) => gridShape(i, t, 3),
    (i, t) => gridShape(i, t, 4)
  ];
  function gridShape(i, t, mode) {
    const d = drift(i, t, 10, .9);
    const isAI = role[i] === 2 || role[i] === 3;
    const signal = role[i] === 0 && pv[i] < .22;
    if (signal) {
      // 信号流：沿中轴来回穿梭
      const phase = (t * (mode === 3 ? .55 : .38) + pw[i]) % 1;
      const dir = pw[i] < .5 ? phase : 1 - phase;
      return [mix(-320, 320, dir) + d[0], (pv[i] / .22 - .5) * 95 + d[1]];
    }
    const side = (mode === 2) ? (isAI ? 1 : -1) : (isAI ? -1 : 1);
    const col = Math.floor(pu[i] * 5), row = Math.floor(pw[i] * 7);
    const gx = (col + .5) / 5 - .5, gy = (row + .5) / 7 - .5;
    const jitter = mode === 4 ? (pz[i] - .5) * 14 : 0;
    return [side * 235 + gx * 190 + jitter + d[0], gy * 300 + d[1]];
  }

  SH.cluster = [
    (i, t) => clusterShape(i, t, 0),
    (i, t) => clusterShape(i, t, 1),
    (i, t) => clusterShape(i, t, 2),
    (i, t) => clusterShape(i, t, 3),
    (i, t) => clusterShape(i, t, 4)
  ];
  function clusterShape(i, t, mode) {
    const d = drift(i, t, 20, .7);
    if (mode === 2 || mode === 3 || mode === 4) {
      // 聚成一个社群球
      const z = pz[i] * 2 - 1, rr = Math.sqrt(Math.max(0, 1 - z * z)), ang = pu[i] * TAU + t * .12;
      const breathe = mode === 3 ? 1 + Math.sin(t * .8) * .07 : 1;
      const R = (mode === 2 ? 300 : mode === 3 ? 330 : 380) * breathe;
      return [Math.cos(ang) * rr * R * 1.15 + d[0] * .6, Math.sin(ang) * rr * R + d[1] * .6];
    }
    const c = Math.floor(pu[i] * 4), a = c / 4 * TAU + t * .16;
    const spread = mode === 1 ? .72 : 1;
    const cx = Math.cos(a) * 300 * spread, cy = Math.sin(a) * 185 * spread;
    const ang = pv[i] * TAU, R = (0.1 + 0.9 * pw[i]) * 150;
    if (mode === 1 && role[i] === 0 && pz[i] < .2) {
      // 簇之间的连线
      const u = pw[i], y = (pz[i] / .2 - .5) * 110;
      return [mix(-260, 260, u) + d[0] * .6, y + d[1] * .6];
    }
    return [cx + Math.cos(ang) * R * 1.2 + d[0], cy + Math.sin(ang) * R + d[1]];
  }

  SH.sphere = [
    (i, t) => sphereShape(i, t, 0),
    (i, t) => sphereShape(i, t, 1),
    (i, t) => sphereShape(i, t, 2),
    (i, t) => sphereShape(i, t, 3),
    (i, t) => sphereShape(i, t, 4)
  ];
  function sphereShape(i, t, mode) {
    const d = drift(i, t, 12, .5);
    if (mode === 0) {
      // 三道流光从三个方向飞入（沿射线拉长，合流时收紧）
      const k = clamp01(t / 7);
      const lane = role[i] === 1 ? 0 : (role[i] === 2 || role[i] === 3) ? 1 : 2;
      const a = lane * 2.0944;
      const rr = mix(1020, 430, k);
      // 沿射线持续流动：粒子不是静止的一团，而是真的在"流"
      const flow = (t * .8 + pv[i]) % 1;
      const along = (flow - .5) * 900 * (1 - k * .45);   // 拉长成流线
      const wide = (pw[i] - .5) * 72;
      const ca = Math.cos(a), sa = Math.sin(a);
      return [ca * (rr + along) - sa * wide, sa * (rr + along) * .82 + ca * wide * .82];
    }
    const z = pz[i] * 2 - 1, rr = Math.sqrt(Math.max(0, 1 - z * z));
    const ang = pu[i] * TAU + t * (mode >= 3 ? .16 : .1);
    let R = 430 + (pv[i] - .5) * 40;
    if (mode === 3) {
      // 涌现：外圈卫星
      const s = role[i] === 0 && pz[i] < .22;
      if (s) {
        const a2 = pu[i] * TAU + t * .5;
        const R2 = 520 + (pv[i] / .22 - .5) * 70;
        return [Math.cos(a2) * R2 * 1.15 + d[0], Math.sin(a2) * R2 * .85 + d[1]];
      }
      R = 400;
    }
    if (mode === 4) R = 470;
    return [Math.cos(ang) * rr * R * 1.12 + d[0], Math.sin(ang) * rr * R + d[1]];
  }

  SH.gate = [
    (i, t) => gateShape(i, t, 0),
    (i, t) => gateShape(i, t, 1),
    (i, t) => gateShape(i, t, 2),
    (i, t) => gateShape(i, t, 3)
  ];
  function gateShape(i, t, mode) {
    const d = drift(i, t, 12, .6);
    if (mode === 2 || mode === 3) {
      // 收成品牌标记（圆角方）
      const side = pu[i] < .5 ? -1 : 1;
      const sx = Math.sign(pu[i] - .5), sy = Math.sign(pv[i] - .5);
      const m = 300;
      return [sx * m * .8, sy * m * .8];
    }
    const leg = pv[i] < .3;
    if (leg) {
      const side = pu[i] < .5 ? -1 : 1;
      const h = (pv[i] / .3) * 330;
      if (mode === 1) {
        // 往门里流
        const phase = (t * .5 + pw[i]) % 1;
        return [side * 330 * (1 - phase) + d[0], 330 - h * phase + d[1]];
      }
      return [side * 330 + d[0], 330 - h + d[1]];
    }
    const u = pu[i] * 2 - 1;
    const ang = Math.acos(clamp(u, -1, 1));
    const R = 330;
    return [Math.cos(ang) * R * 1.1 + d[0], 330 - Math.sin(ang) * R + d[1]];
  }

  /* ==========================================================
     场景与文案
     ========================================================== */
  const SCENES = [
    { id:'hook', t:0, dur:20, shape:'ignite', vars:1, acc:'start',
      cam:[{t:0,zoom:1.62,x:0,y:-20},{t:1.2,zoom:1.0,x:0,y:0},{t:10,zoom:1.1,x:0,y:-10},{t:19,zoom:1.02,x:0,y:0}],
      lines:[
        { at:1.5, dur:15, kicker:'万物 · 起点', head:'一切从一个节点开始', sub:'最初的节点是人', sfx:['riser','impact'] }
      ]},
    { id:'one', t:20, dur:60, shape:'bipolar', vars:5, acc:'one',
      cam:[{t:20,zoom:1.02,x:-450,y:-16},{t:32,zoom:1.14,x:-420,y:-34},{t:44,zoom:1.0,x:-450,y:-16},{t:56,zoom:1.12,x:-440,y:-30},{t:79,zoom:1.04,x:-450,y:-16}],
      lines:[
        { at:1, dur:12, kicker:'一 · 人与 AI', head:'AI 不是工具，\n而是另一个数字的伙伴', sub:'它由数字构成，却不只是一个数字', sfx:['hit','thud'] },
        { at:14, dur:12, head:'它记得你说过的话', sub:'也记得你不想再被问起的事', sfx:['pop'] },
        { at:27, dur:12, head:'它有偏好，会固执', sub:'它有边界，会拒绝', sfx:['pop'] },
        { at:40, dur:15, head:'回应你的\n不再是一段话', sub:'而是一直都在的另一方', sfx:['chime'] }
      ]},
    { id:'two', t:80, dur:60, shape:'lattice', vars:5, acc:'two',
      cam:[{t:80,zoom:1.0,x:-450,y:-16},{t:92,zoom:1.1,x:-460,y:-6},{t:104,zoom:.96,x:-430,y:-24},{t:116,zoom:1.12,x:-470,y:-4},{t:130,zoom:1.0,x:-450,y:-16},{t:139,zoom:1.04,x:-450,y:-16}],
      lines:[
        { at:1, dur:12, kicker:'二 · AI 与 AI', head:'当智能体开始\n彼此对话', sub:'一个模型调用另一个模型', sfx:['glitch','hit'] },
        { at:14, dur:12, head:'它们质询彼此', sub:'在对方的错误里修正自己', sfx:['pop'] },
        { at:27, dur:12, head:'一次任务，\n串起一串推理', sub:'其中没有一环是你亲手写的', sfx:['pop'] },
        { at:40, dur:15, head:'能力不再属于\n某个模型', sub:'而属于节点之间刚刚发生的连接', sfx:['chime'] }
      ]},
    { id:'three', t:140, dur:60, shape:'cluster', vars:5, acc:'three',
      cam:[{t:140,zoom:1.06,x:-450,y:-16},{t:152,zoom:.98,x:-440,y:-24},{t:164,zoom:1.12,x:-460,y:-8},{t:176,zoom:1.0,x:-450,y:-16},{t:190,zoom:1.08,x:-455,y:-20},{t:199,zoom:1.0,x:-450,y:-16}],
      lines:[
        { at:1, dur:12, kicker:'三 · 人与人', head:'人与人之间，\n重新回归连接', sub:'在一个人人都在线的时代', sfx:['hit','thud'] },
        { at:14, dur:12, head:'稀缺的从来\n不是渠道', sub:'是有人愿意先开口', sfx:['pop'] },
        { at:27, dur:12, head:'我们把技术用在\n让人重新相遇的地方', sub:'而不是让相遇变少', sfx:['pop'] },
        { at:40, dur:15, head:'信任需要被重新建立', sub:'一次真实的对话就够了', sfx:['chime'] }
      ]},
    { id:'all', t:200, dur:60, shape:'sphere', vars:5, acc:'all',
      cam:[{t:200,zoom:1.0,x:-450,y:0},{t:212,zoom:.9,x:-420,y:10},{t:224,zoom:.86,x:-390,y:0},{t:236,zoom:.8,x:-380,y:10},{t:248,zoom:.9,x:-420,y:0},{t:259,zoom:1.0,x:-450,y:0}],
      lines:[
        { at:1, dur:12, kicker:'万物', head:'犹如三生万物', sub:'人与 AI、AI 与 AI、人与人', sfx:['riser','impact','subdrop'] },
        { at:14, dur:12, head:'三种关系同时成立', sub:'新的东西不需要被发明', sfx:['pop'] },
        { at:27, dur:12, head:'它们自己生长，\n自己连接，自己提问', sub:'像涟漪一样扩散', sfx:['pop'] },
        { at:40, dur:15, head:'万物不是\n被造出来的', sub:'是被关系带出来的', sfx:['chime','sparkle'] }
      ]},
    { id:'join', t:260, dur:40, shape:'gate', vars:4, acc:'join',
      cam:[{t:260,zoom:1.0,x:0,y:0},{t:272,zoom:1.12,x:0,y:-10},{t:284,zoom:1.02,x:0,y:0},{t:299,zoom:1.06,x:0,y:0}],
      lines:[
        { at:1, dur:11, kicker:'加入我们', head:'让你的回声，\n被更多节点听见', sub:'这里有正在造 AI 的人', sfx:['whoosh','hit'] },
        { at:13, dur:11, head:'有正在和人机协作的\n团队', sub:'也有一群自己就会互相连接的智能体', sfx:['pop'] },
        { at:25, dur:12, head:'进来，把你的节点接上', sub:'', sfx:['stamp','ding'] }
      ]}
  ];
  const TOTAL = 300;

  /* ---------------- 场景查询 ---------------- */
  function sceneAt(t) {
    for (let k = SCENES.length - 1; k >= 0; k--) if (t >= SCENES[k].t) return SCENES[k];
    return SCENES[0];
  }

  /* ---------------- 位置 ---------------- */
  function posOf(i, t) {
    const sc = sceneAt(t);
    const local = t - sc.t;
    const varDur = sc.dur / sc.vars;
    let v = Math.min(sc.vars - 1, Math.floor(local / varDur));
    const vt = local - v * varDur;
    const BLEND = 1.8;
    if (v > 0 && vt < BLEND) {
      const b = smooth(vt / BLEND);
      const prev = SH[sc.shape][v - 1](i, varDur);
      const cur = SH[sc.shape][v](i, vt);
      return [mix(prev[0], cur[0], b), mix(prev[1], cur[1], b)];
    }
    const p = SH[sc.shape][v](i, vt);
    // 整场呼吸 + 双向行波 + 每颗粒子自己的轨道
    // 5 分钟尺度上这是关键：形态会"停住"，但场必须一直活着
    const k = 1 + Math.sin(t * .23) * .07;
    const wy = Math.sin(t * 1.15 + p[1] * .006) * 18;
    const wx = Math.cos(t * .87 + p[0] * .005) * 14;
    const ph = pz[i] * TAU;
    const orb = 5 + pz[i] * 11;
    const ox = Math.cos(ph + t * (.5 + pu[i] * .9)) * orb;
    const oy = Math.sin(ph * 1.3 + t * (.45 + pv[i] * .8)) * orb;
    return [p[0] * k + wx + ox, p[1] * k + wy + oy];
  }

  /* ---------------- 相机 ---------------- */
  function camAt(t) {
    const sc = sceneAt(t);
    const keys = sc.cam;
    let i = 0;
    while (i < keys.length - 1 && t >= keys[i + 1].t) i++;
    const a = keys[i], b = keys[Math.min(keys.length - 1, i + 1)];
    const f = b.t > a.t ? smooth((t - a.t) / (b.t - a.t)) : 0;
    return [mix(a.zoom, b.zoom, f), mix(a.x, b.x, f), mix(a.y, b.y, f)];
  }

  /* ==========================================================
     渲染
     ========================================================== */
  const cvs = document.getElementById('field');
  const ctx = cvs.getContext('2d', { alpha: true });
  const xs = new Float32Array(N), ys = new Float32Array(N), al = new Float32Array(N);
  const spriteFor = col => {
    const s = document.createElement('canvas'); s.width = s.height = 48;
    const c = s.getContext('2d');
    const g = c.createRadialGradient(24, 24, 0, 24, 24, 24);
    g.addColorStop(0, css(col, 1)); g.addColorStop(.22, css(col, .55));
    g.addColorStop(.55, css(col, .13)); g.addColorStop(1, css(col, 0));
    c.fillStyle = g; c.fillRect(0, 0, 48, 48);
    return s;
  };
  const SPRITES = ROLE_COL.map(c => spriteFor(c || [1,1,1]));
  const SPRITE_ACC = spriteFor([1,1,1]);

  const CELL = 118, COLS = Math.ceil(W / CELL) + 2, ROWS = Math.ceil(H / CELL) + 2;
  const head = new Int32Array(COLS * ROWS), nxt = new Int32Array(N);
  const BUCK = 6, MAXSEG = 2600;
  const segs = Array.from({ length: BUCK }, () => new Float32Array(MAXSEG * 4));
  const segN = new Int32Array(BUCK);

  function draw(t) {
    const [zoom, camX, camY] = camAt(t);
    const sc = sceneAt(t);
    const acc = ACCENT[sc.acc];
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';


    head.fill(-1);
    for (let i = 0; i < N; i++) {
      const cx = clamp((xs[i] / CELL) | 0, 0, COLS - 1), cy = clamp((ys[i] / CELL) | 0, 0, ROWS - 1);
      const k = cy * COLS + cx; nxt[i] = head[k]; head[k] = i;
    }
    segN.fill(0);
    const linkDist = 132, d2 = linkDist * linkDist;
    for (let i = 0; i < N; i++) {
      if (!al[i]) continue;
      const cx = clamp((xs[i] / CELL) | 0, 0, COLS - 1), cy = clamp((ys[i] / CELL) | 0, 0, ROWS - 1);
      for (let oy = 0; oy <= 1; oy++) {
        for (let ox = -1; ox <= 1; ox++) {
          if (oy === 0 && ox < 0) continue;
          if (oy === 1 && ox === 1) continue;
          const nx = cx + ox, ny = cy + oy;
          if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
          let j = head[ny * COLS + nx];
          while (j !== -1) {
            if (j > i) {
              const dx = xs[i] - xs[j], dy = ys[i] - ys[j];
              if (dx * dx + dy * dy < d2) {
                const b = (role[i] === 0 && role[j] === 0) ? 0 : Math.min(role[i] === 0 ? 5 : role[i], role[j] === 0 ? 5 : role[j]);
                const bi = Math.min(5, b);
                const arr = segs[bi], n = segN[bi];
                if (n < MAXSEG) {
                  const o = n * 4;
                  arr[o] = xs[i]; arr[o+1] = ys[i]; arr[o+2] = xs[j]; arr[o+3] = ys[j];
                  segN[bi] = n + 1;
                }
              }
            }
            j = nxt[j];
          }
        }
      }
    }
    for (let b = 0; b < BUCK; b++) {
      const n = segN[b]; if (!n) continue;
      const col = b === 0 ? acc : ROLE_COL[b];
      ctx.strokeStyle = css(col, .30); ctx.lineWidth = 1.15;
      ctx.beginPath();
      const arr = segs[b];
      for (let s = 0; s < n; s++) { const o = s * 4; ctx.moveTo(arr[o], arr[o+1]); ctx.lineTo(arr[o+2], arr[o+3]); }
      ctx.stroke();
    }
    for (let i = 0; i < N; i++) {
      if (!al[i]) continue;
      const col = role[i] === 0 ? acc : ROLE_COL[role[i]];
      const sp = role[i] === 0 ? SPRITE_ACC : SPRITES[role[i]];
      const r = psize[i] * (role[i] === 0 ? 1 : 1.15) * (zoom < 1 ? zoom : 1);
      ctx.globalAlpha = al[i];
      ctx.drawImage(sp, xs[i] - r * 1.6, ys[i] - r * 1.6, r * 3.2, r * 3.2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ==========================================================
     文字：每个文案一个块（无回调，避免 history-dependent）
     ========================================================== */
  const esc = c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' })[c] || c;
  const linesHost = document.getElementById('lines');
  const blocks = [];

  SCENES.forEach(sc => sc.lines.forEach((ln, i) => {
    const center = sc.id === 'join';
    const el = document.createElement('div');
    el.className = 'ln-anchor' + (center ? ' ln-anchor--center' : '');
    el.setAttribute('data-layout-allow-occlusion', '');
    el.setAttribute('data-om-id', 'ln-' + sc.id + '-' + i);
    const kick = ln.kicker ? `<div class="ln__kick"><i></i><span>${esc(ln.kicker)}</span></div>` : '';
    const head = [...ln.head].map(c => (c === ' ' || c === '\n') ? c
      : `<span class="mask"><span class="ch">${esc(c)}</span></span>`).join('');
    const sub = ln.sub ? `<p class="ln__sub">${esc(ln.sub)}</p>` : '';
    el.innerHTML = `<div class="ln">${kick}<h2 class="ln__head">${head}</h2>${sub}</div>`;
    linesHost.appendChild(el);
    blocks.push({
      scene: sc, line: ln, el,
      inner: el.querySelector('.ln'),
      chars: el.querySelectorAll('.ch'),
      kick: el.querySelector('.ln__kick'),
      sub: el.querySelector('.ln__sub')
    });
  }));

  /* ==========================================================
     时间轴
     ========================================================== */
  const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
  const huds = [...document.querySelectorAll('.hud__ch')];
  const prog = document.getElementById('hudProg');

  gsap.set(blocks.map(b => b.inner), { opacity: 0 });
  gsap.set(blocks.map(b => b.chars), { yPercent: 140 });
  gsap.set(huds, { opacity: 0 });

  SCENES.forEach((sc, si) => {
    tl.addLabel('scene:' + sc.id, sc.t);
    tl.fromTo(huds[si], { opacity: 0 }, { opacity: 1, duration: .6 }, sc.t);
    if (si > 0) tl.to(huds[si - 1], { opacity: 0, duration: .5 }, sc.t);

    sc.lines.forEach((ln, li) => {
      const b = blocks.find(x => x.scene === sc && x.line === ln);
      const at = sc.t + ln.at;
      const out = at + ln.dur;
      tl.fromTo(b.inner, { opacity: 0, x: -34 }, { opacity: 1, x: 0, duration: .5, immediateRender: false }, at);
      if (b.kick) tl.fromTo(b.kick, { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: .5, immediateRender: false }, at);
      tl.fromTo(b.chars, { yPercent: 140 }, { yPercent: 0, duration: .85, stagger: .026, ease: 'expo.out', immediateRender: false }, at + .12);
      if (b.sub) tl.fromTo(b.sub, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .7, immediateRender: false }, at + .55);
      tl.to(b.inner, { opacity: 0, duration: .55 }, out);
      if (b.kick) tl.to(b.kick, { opacity: 0, duration: .4 }, out);
      tl.to(b.chars, { yPercent: -140, duration: .6, stagger: .018, ease: 'power2.in' }, out);
      if (b.sub) tl.to(b.sub, { opacity: 0, duration: .4 }, out);
      // 主音效落在"字全部就位"的那一帧
      const land = at + .12 + .85 + .026 * Math.max(0, (ln.head || '').length - 1);
      (ln.sfx || []).forEach((sfx, k) => OM.sfx(sfx, land + k * .13));
      if (b.kick) OM.sfx('tick', at + .05, { gain: .25 });
      if (b.sub) OM.sfx('pop', at + .62, { gain: .28, note: 3 });
    });
  });

  /* 尾卡 */
  const endcard = document.querySelector('.endcard');
  gsap.set(endcard, { opacity: 0 });
  document.querySelector('.endcard__cta').textContent = V.cta;
  document.querySelector('.endcard__url').textContent = V.url;
  document.querySelector('.endcard__brand').textContent = V.brand;
  document.querySelector('.hud__tl').textContent = V.brand;

  tl.fromTo(endcard, { opacity: 0 }, { opacity: 1, duration: .9 }, 286)
    .fromTo('.endcard__mark', { opacity: 0, scale: .6, rotation: -20 }, { opacity: 1, scale: 1, rotation: 0, duration: .9, ease: 'expo.out', immediateRender: false }, 286.1)
    .fromTo('.endcard__brand', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .9, ease: 'expo.out', immediateRender: false }, 286.3)
    .fromTo('.endcard__cta', { opacity: 0, y: 18, scale: .96 }, { opacity: 1, y: 0, scale: 1, duration: .7, ease: 'expo.out', immediateRender: false }, 287)
    .fromTo('.endcard__url', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: .7, immediateRender: false }, 287.2)
    .fromTo('.endcard__brand', { letterSpacing: '.06em' }, { letterSpacing: '.2em', duration: 1.2, ease: 'expo.out' }, 288)
    .to({}, { duration: V.endHold });

  /* 进度条随时间走（纯函数） */
  OM.clock(tl, draw, TOTAL);
  const oldDraw = draw;

  window.__timelines['film5'] = tl;
})();
