      <p>人与 AI、AI 与 AI、人与人——三种关系，长出万物。</p>
      <p>道 · 起点：一切从一个节点开始。最初的节点是人。</p>
      <p>一 · 人与 AI：AI 不是工具，是另一个在场的人。它有记忆，有判断，也有边界。</p>
      <p>二 · AI 与 AI：当智能体开始彼此对话，一个模型调用另一个模型，协作、质询、接力。</p>
      <p>三 · 人与人：人与人之间，重新长出连接。稀缺的一直是信任。</p>
      <p>万物：当这三种连接同时成立，新的东西不需要被发明，它自己会生长出来。</p>
